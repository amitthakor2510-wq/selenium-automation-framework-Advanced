# =============================================================================
# DEPENDENCY LICENSE POLICY  (read by com.automation.core.license.LicenseScanner)
# Used by: `mvn exec:java@license-scan -Plicense-check`, the license.scan.enabled
# test-run hook, and the CI "license-scan" jobs. Every key can be overridden with
# -Dkey=value. If this file is deleted the same defaults apply (see LicensePolicy).
#
# Identifiers are SPDX-style. The scanner turns the free text in each POM
# ("The Apache Software License, Version 2.0") into these ids first.
#
# Rule: Maven treats several <license> entries as alternatives. A dependency is
#   ALLOWED  if ANY declared license is in license.allowed
#   DENIED   if ALL declared licenses are in license.denied
#   REVIEW   otherwise (unknown / unlisted license - a human decides)
#   MISSING  if no license information exists at all
# =============================================================================

# Fine to ship with. (Weak-copyleft ones are here on purpose: using EPL/MPL/CDDL libraries
# unmodified as dependencies is normally acceptable - remove them if your legal team disagrees.)
license.allowed=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,EPL-1.0,EPL-2.0,CDDL-1.0,CDDL-1.1,MPL-2.0,GPL-2.0-with-classpath-exception,GPL-3.0-with-classpath-exception,CC0-1.0,Public-Domain,Unlicense,Zlib

# Never acceptable. Strong copyleft / non-open "source available" licenses.
license.denied=GPL-2.0,GPL-3.0,AGPL-3.0,SSPL-1.0,BUSL-1.1,Commons-Clause,JSON,BSD-4-Clause

# What a finding does to the result: IGNORE | WARN | FAIL
#   denied  -> FAIL  (the scan exits non-zero, so a CI job / `mvn` run goes red)
#   review  -> WARN  (listed in the report and the e-mail, build stays green). Set FAIL to be strict.
#   missing -> WARN  (same). Many old jars simply declare no license; set FAIL once you've cleaned up.
license.denied.action=FAIL
license.review.action=WARN
license.missing.action=WARN

# Skip these entirely. Comma-separated "group:artifact" or "group:*".
# e.g. your own company's internal artifacts:
# license.ignore=com.mycompany:*
license.ignore=

# Fix a wrong or missing declaration by hand. "group:artifact=ID" or "group:*=ID", several ids with |,
# entries separated by commas. Record WHY next to each override.
# e.g. license.overrides=org.example:old-lib=Apache-2.0
license.overrides=
