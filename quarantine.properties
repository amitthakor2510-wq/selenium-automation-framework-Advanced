# ==================================================================
# FLAKY TEST QUARANTINE - known-flaky tests that may fail without failing the build
# ==================================================================
# A quarantined test STILL RUNS (so you keep seeing whether it passes), but when it fails its
# result is reported as SKIPPED ("Quarantined - <ticket> ...") instead of FAILED, with the usual
# screenshot / page source / video attached and the Allure label "quarantined". It is not retried.
#
# Every entry MUST carry an expiry date. After that day the test fails the build normally again,
# so a quarantine can't quietly become permanent: fix the test, or consciously renew the date.
# Expired entries are listed in the log at the start of every run.
#
# Format (same targets as test-config.properties):
#   <target> = <last day yyyy-MM-dd> | <ticket> | <reason>
#
#   LoginTest#verifyValidLogin = 2026-11-15 | QA-412 | CAPTCHA solver misreads 'f'
#   BrokenLinksImagesTest      = 2026-10-31 | QA-377 | external CDN is intermittently down
#   com.automation.sites.demoqa.tests.*   = 2026-11-01 | QA-300 | demoqa staging data reset
#
# Cucumber scenarios (all scenarios run through ONE TestNG method, so they have their own targets):
#   scenario: Login with a locked-out user  = 2026-11-15 | QA-412 | intermittent captcha
#   scenario: Checkout *                    = 2026-11-15 | QA-9   | * is a wildcard
#   feature: checkout.feature               = 2026-11-15 | QA-9   | every scenario in the file
#   tag: @flaky                             = 2026-11-15 | QA-7   | every scenario carrying the tag
# or on the scenario itself, no file edit needed (the date is mandatory):
#   @quarantine_until_2026-11-15 @ticket_QA-412
#   Scenario: Login with a locked-out user
# A rule naming the runner class (CucumberRunnerTest) still quarantines ALL scenarios.
# A scenario name cannot contain '=' (use * instead). The Allure result written by the Cucumber
# plugin stays "failed" but gets the label "quarantined"; the TestNG result, the CI gate and the
# Extent report treat it as skipped.
#
# <target> is a simple or fully-qualified class name, Class#method, or a package ending in .* -
# a Class#method entry wins over a class or package entry. A line with a missing or malformed date
# is ignored with a warning (the test then fails normally - a typo can never hide a failure).
#
# The same thing can be written on the test itself:
#   @Quarantine(until = "2026-11-15", ticket = "QA-412", reason = "...")   // method or class
#
# This is not "disable": use test-config.properties to stop a test from running at all.
#
# Strict run that ignores every quarantine (e.g. nightly):   mvn test -Dquarantine.enabled=false
# Use a different file for one run:                           mvn test -Dquarantine.file=other.properties
# Summary of what failed under quarantine:                   target/quarantine/summary-<site>.txt
# ==================================================================
