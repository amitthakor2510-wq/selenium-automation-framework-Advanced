<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Test Wizard — Automation Console</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/wizard/static/wizard.css" />
<link rel="stylesheet" href="/hub/static/hub.css" />
<script src="/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <span class="brand-name">Test Wizard</span>
          <span class="brand-sub">Build, save and run a test without writing code</span>
        </div>
      </div>
      <div class="topbar-status">
        <span id="whoami" class="pill pill-muted">…</span>
        <a class="btn btn-ghost" href="/hub">← Test Hub</a>
        <a class="btn btn-ghost" href="/control">Control Center</a>
        <a class="btn btn-ghost" href="/">Console</a>
        <button class="btn btn-ghost btn-icon" type="button" title="Toggle light/dark" aria-label="Toggle light/dark theme" data-theme-toggle><svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
      </div>
    </div>
  </header>
  <main class="wrap" id="main" tabindex="-1">
    <ol id="stepper" class="stepper" aria-label="Wizard steps"></ol>
    <div id="banner" class="wz-banner" hidden></div>
    <section class="panel panel-wide wz-panel">
      <div class="panel-head"><h2 id="stepTitle"></h2><p id="stepSub" class="panel-sub"></p></div>
      <div id="stepBody" class="wz-body"></div>
      <div id="errorSummary" class="wz-errors" role="alert" hidden></div>
      <div class="wz-nav">
        <button id="backBtn" class="btn btn-ghost" type="button">Back</button>
        <button id="nextBtn" class="btn btn-primary" type="button">Next</button>
      </div>
    </section>
  </main>
  <script src="/hub/static/results.js"></script>
  <script src="/wizard/static/wizard.js"></script>
</body>
</html>
