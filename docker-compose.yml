# =============================================================================
# selenium-automation-framework — Docker Selenium Grid
#
# Usage:
#   docker compose up -d selenium-hub chrome firefox edge   # start the grid
#   docker compose run --rm tests                           # run demoqa smoke on chrome (defaults)
#   docker compose run --rm -e BROWSER=firefox -e SITE=saucedemo -e SUITE=testng-suites/saucedemo-regression.xml tests
#   open http://localhost:4444/ui to watch the grid / live VNC view per node
#   docker compose down -v                                  # tear everything down
#
# SCALABILITY: SE_NODE_MAX_SESSIONS=3 (below, per node) matches
# testng-suites/*.xml's parallel="classes" thread-count="3" — the tests
# container can now actually run 3 concurrent WebDriver sessions against a
# given browser node instead of the 4th+ (there is no 4th here, but a future
# thread-count bump) queuing behind SE_NODE_MAX_SESSIONS=2. shm_size is
# bumped to 3gb per node (was 2gb) to give each of those concurrent
# browser processes its own /dev/shm headroom. Raise all three together
# (testng-suites thread-count, SE_NODE_MAX_SESSIONS, shm_size) if you
# increase parallelism further — and make sure the host actually has the
# RAM/CPU for that many concurrent full browser processes.
# =============================================================================

# SAFARI — deliberately has no node service here, unlike chrome/firefox/
# edge above. Selenium's official Grid node images only exist for
# Chromium/Gecko-based browsers; there is no (and cannot be a)
# selenium/node-safari image, because safaridriver ships inside macOS
# itself and Apple doesn't license/support it running inside a Linux
# container. Safari can still be exercised via this same Grid (grid.
# enabled=true, see DriverFactory) if selenium-hub is pointed at a REAL
# Mac running its own `selenium-server` node registered against this hub
# — that machine is out of scope for this compose file (which only stands
# up containerized nodes) and must be run separately. For a normal local
# run, Safari goes through DriverFactory's local (non-Grid) path instead —
# see testng-suites/*-safari-*.xml and the Safari section of docs/ci-cd.md.
# SECURITY: a Selenium Grid has no authentication - anyone who can reach port 4444 can start browsers (and
# run code) on this machine. The Grid and noVNC ports are therefore published on 127.0.0.1 only. To reach
# them from another machine, set GRID_BIND_ADDRESS=0.0.0.0 (only on a trusted network / behind a firewall).
services:

  selenium-hub:
    image: selenium/hub:4.49.0-20260909
    container_name: selenium-hub
    ports:
      - "${GRID_BIND_ADDRESS:-127.0.0.1}:4442:4442"
      - "${GRID_BIND_ADDRESS:-127.0.0.1}:4443:4443"
      - "${GRID_BIND_ADDRESS:-127.0.0.1}:4444:4444"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 10s
      timeout: 5s
      retries: 10

  chrome:
    image: selenium/node-chrome:4.49.0-20260909
    container_name: selenium-chrome
    shm_size: 3gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=3
    ports:
      - "${GRID_BIND_ADDRESS:-127.0.0.1}:7900:7900"   # noVNC — watch the browser live at http://localhost:7900 (pwd: secret)

  firefox:
    image: selenium/node-firefox:4.49.0-20260909
    container_name: selenium-firefox
    shm_size: 3gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=3
    ports:
      - "${GRID_BIND_ADDRESS:-127.0.0.1}:7901:7900"

  edge:
    image: selenium/node-edge:4.49.0-20260909
    container_name: selenium-edge
    shm_size: 3gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=3
    ports:
      - "${GRID_BIND_ADDRESS:-127.0.0.1}:7902:7900"

  # One-shot helper: (re)creates the report folders and makes them writable BEFORE the tests start.
  # Without it, `mvn clean` (which deletes ./target) followed by `docker compose run tests` leaves
  # Docker to auto-create the bind-mount folders as root, and the container's non-root user (uid 1000)
  # then fails with "Could not write Allure test result container". Runs as root, exits immediately.
  fix-perms:
    image: busybox:1.36
    user: root
    restart: "no"
    command:
      - sh
      - -c
      - >
        mkdir -p /w/target/allure-results /w/target/extent-reports /w/target/surefire-reports
        /w/target/debug-dumps /w/target/screenshots /w/self-healing-data &&
        chmod -R a+rwX /w/target /w/self-healing-data
    volumes:
      - ./target:/w/target
      - ./self-healing-data:/w/self-healing-data

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selenium-tests
    # The browser nodes must be up too, otherwise the hub has nothing to run the
    # session on and the test just hangs ~3 min, then fails with SessionNotCreatedException.
    depends_on:
      fix-perms:
        condition: service_completed_successfully
      selenium-hub:
        condition: service_healthy
      chrome:
        condition: service_started
      firefox:
        condition: service_started
      edge:
        condition: service_started
    environment:
      - SITE=saucedemo
      - BROWSER=chrome
      # NOTE: HEADLESS is left true here on purpose for unattended/CI-style
      # `docker compose run --rm tests` runs — it no longer matters for
      # what you see on :7900/7901/7902 either way. DriverFactory now
      # ignores this flag for Grid (remote) sessions and always launches
      # a normal windowed browser inside the node's own Xvfb, because
      # that virtual display + noVNC is what selenium/node-* images use
      # to be watchable live — a browser-level --headless=new would just
      # render nothing into it. So: this flag now only affects LOCAL
      # (non-Grid) runs; to actually watch a Grid run, open
      # http://localhost:7900 (chrome / firefox:7901 / edge:7902,
      # password "secret") regardless of what HEADLESS is set to here.
      - HEADLESS=true
      - GRID_ENABLED=true
      - GRID_URL=http://selenium-hub:4444/wd/hub
      - SUITE=testng-suites/saucedemo-smoke.xml
    volumes:
      # Maven cache: a named volume is pre-filled from the image's /home/automation/.m2 on first use,
      # then keeps every plugin/jar `docker compose run` downloads, so later runs skip the ~30 MB re-download.
      - m2-cache:/home/automation/.m2
      # Persist reports/screenshots/allure-results back to the host after the run
      - ./target/allure-results:/workspace/target/allure-results
      - ./target/extent-reports:/workspace/target/extent-reports
      - ./target/surefire-reports:/workspace/target/surefire-reports
      - ./target/debug-dumps:/workspace/target/debug-dumps
      - ./target/screenshots:/workspace/target/screenshots
      # Self-healing locator baseline (see LocatorRepository.java) — this
      # one isn't just "nice to persist" like the reports above, it's load-
      # bearing for the feature: `docker compose run --rm tests` throws the
      # whole container away after every run, so without this mount the
      # baseline would be written inside the dead container and never seen
      # again — self-healing would silently never have anything to heal
      # against, the exact same bug as the target/ path it was moved out of.
      - ./self-healing-data:/workspace/self-healing-data

volumes:
  m2-cache:
