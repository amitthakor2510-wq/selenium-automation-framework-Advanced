# =========================================================
# OBJECT REPOSITORY: SAHMAT
# One locator per line: <key> = <type>:<value>
# Supported types: id, name, css, xpath, class, linktext, partiallinktext, tag
#
# THIS is the file to edit when a dev changes the site's markup/ids —
# never the Java test class or KeywordEngine. Every CLICK/TYPE/etc.
# keyword is also routed through SelfHealingEngine (see
# HumanActions.click/type and KeywordEngine.waitVisible), so minor id/
# attribute drift heals itself automatically after the first successful
# run against the real page; this file only needs a manual update when
# the healing engine's DOM-similarity match can't find anything close
# (a genuinely different element/widget was swapped in).
#
# LOCATORS BELOW ARE PLACEHOLDERS: staging2.pmgatishakti.gov.in isn't
# reachable from the sandbox this framework was built in, so these are
# generic best-guess selectors (type/id/name/placeholder-contains),
# not verified against the real DOM. After the first real run:
#   - target/self-healing/sahmat-healing-report.json lists anything
#     the engine had to heal — if a key heals every run, replace this
#     line with the value it healed to instead of relying on healing
#     every time.
#   - Anything that fails outright (SelfHealingEngine found no close
#     enough DOM match either) needs its value replaced here from
#     browser devtools — the CSV script and Java class need zero edits
#     either way.
# =========================================================

sahmat.header.loginTrigger=xpath:/html/body/section/header/div/div[2]/a/span
sahmat.login.email=xpath:/html/body/div[4]/div/div/div[2]/div/div[2]/form/div[1]/input
sahmat.login.password=xpath:/html/body/div[4]/div/div/div[2]/div/div[2]/form/div[2]/div/input
sahmat.login.sendotptrigger=xpath:/html/body/div[4]/div/div/div[2]/div/div[2]/form/div[3]/div/button
# OTP field only renders after sendotptrigger is clicked and the server
# accepts the request - PLACEHOLDER selector (site unreachable from sandbox,
# see file header), matches on common name/id/placeholder/type=tel patterns.
sahmat.login.otpInput=css:input[name*='otp' i],input[id*='otp' i],input[placeholder*='otp' i],input[type='tel']
sahmat.login.submitButton=xpath:/html/body/div[4]/div/div/div[2]/div/div[2]/form/div[4]/button
sahmat.login.forgotPasswordLink=xpath:/html/body/div[4]/div/div/div[2]/div/div[2]/form/div[5]/div/button
sahmat.login.errorMessage=css:[class*='error'],[role='alert']

# CAPTCHA on the login form — renders only after the login sub-module is
# opened (sahmat.header.loginTrigger), which is why it isn't picked up by
# KeywordEngine.autoHandleCaptcha()'s post-NAVIGATE auto-detect; the CSV
# below runs SOLVE_TEXT_CAPTCHA_IF_PRESENT explicitly instead, which waits
# for the CAPTCHA to render and simply skips (no test failure) if it never
# does — see Keyword.SOLVE_TEXT_CAPTCHA_IF_PRESENT / docs/CAPTCHA_SOLVER.md.
# captchaImage points at whatever renders the CAPTCHA (image or canvas);
# captchaInput is the answer field CaptchaSolver clicks and types into.
sahmat.login.captchaImage=css:[class*='captcha' i] img,[id*='captcha' i] img,img[class*='captcha' i],img[id*='captcha' i],img[src*='captcha' i],canvas[class*='captcha' i],canvas[id*='captcha' i]
sahmat.login.captchaInput=css:input[name*='captcha' i],input[id*='captcha' i],input[placeholder*='captcha' i],input[aria-label*='captcha' i]
sahmat.fptrigger=xpath:/html/body/div[4]/div/div/div[2]/div/div[2]/form/p[2]/a
sahmat.forgotPassword.email=xpath:/html/body/div[5]/div/div/div/div[1]/div[2]/div/input
sahmat.forgotPassword.submitButton=xpath:/html/body/div[5]/div/div/div/div[1]/div[4]/button[1]
sahmat.forgotPassword.successMessage=css:[class*='success'],[role='status']
sahmat.forgotPassword.errorMessage=css:[class*='error'],[role='alert']
sahmat.forgotPassword.backToLoginLink=/html/body/div[5]/div/div/div/div[2]/button

# Restrict OCR whitelist to strictly letters and digits (no symbols)
captcha.text.charset=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789

# Tell the solver to expect exactly 5 characters (enables grid fallback).
# Confirmed from a real captured CAPTCHA screenshot (text_captcha_20260820_114152.png,
# answer "fx7bx") - was previously guessed as 6 before the site was reachable.
# Getting this right matters beyond the grid fallback: splitTouchingCharacters()
# also divides the image's total ink width by this number to estimate one
# character's width, then force-splits any component wider than that
# estimate. With the old value of 6 (one too many), that per-char estimate
# was too narrow, so the "7" - a naturally wide glyph - was being sliced in
# two and misread as "T2" (observed: "fxT2x" instead of "fx7bx"). If a real
# run ever shows CAPTCHAs of a different length, prefer wiring the input
# field's own maxlength/DOM maxLength (see resolveExpectedLength()) over
# bumping this static fallback - it's live per-page and won't drift out of
# sync with the actual site like this value just did.
captcha.expected.length=5
