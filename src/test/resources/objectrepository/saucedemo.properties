# =========================================================
# OBJECT REPOSITORY: saucedemo
# One locator per line: <key> = <type>:<value>
# Supported types: id, name, css, xpath, class, linktext, partiallinktext, tag
# Keep keys in "<site>.<screen>.<element>" or "<site>.<element>" style so
# they read naturally in a keyword script's locatorKey column.
# =========================================================

saucedemo.login.username=id:user-name
saucedemo.login.password=id:password
saucedemo.login.submitButton=id:login-button
saucedemo.login.errorMessage=css:[data-test='error']

saucedemo.inventory.title=css:.title
saucedemo.inventory.cartIcon=css:.shopping_cart_link
saucedemo.inventory.menuButton=id:react-burger-menu-btn
saucedemo.inventory.logoutLink=id:logout_sidebar_link
saucedemo.inventory.firstAddToCartButton=css:.inventory_item:first-child button