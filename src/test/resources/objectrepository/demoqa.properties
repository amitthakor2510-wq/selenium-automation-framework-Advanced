# =========================================================
# OBJECT REPOSITORY: demoqa
# One locator per line: <key> = <type>:<value>
# Supported types: id, name, css, xpath, class, linktext, partiallinktext, tag
# Keep keys in "<site>.<screen>.<element>" style so they read naturally in
# a keyword script's locatorKey column.
#
# Mirrors src/main/java/com/automation/sites/demoqa/pages/TextBoxPage.java's
# locators exactly — if that page object's IDs ever change (demoqa UI
# update), update both places together.
# =========================================================

demoqa.textbox.userName=id:userName
demoqa.textbox.userEmail=id:userEmail
demoqa.textbox.currentAddress=id:currentAddress
demoqa.textbox.permanentAddress=id:permanentAddress
demoqa.textbox.submitButton=id:submit
demoqa.textbox.outputName=id:name
demoqa.textbox.outputEmail=css:#output #email
