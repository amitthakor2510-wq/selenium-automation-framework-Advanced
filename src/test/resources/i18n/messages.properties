# Base / fallback language (English). Used when the active language has no file of its own,
# or when its file lacks a key. Add one messages_<lang>.properties per extra language.
# Files are UTF-8. These are SAMPLE keys - replace/extend with your applications' real strings.
# Messages read with arguments (LanguageUtils.get(key, args...)) use MessageFormat: {0}, {1} ...
# and need a literal apostrophe doubled ('').
common.welcome=Welcome, {0}!
common.cancel=Cancel
login.title=Login
login.username=Username
login.password=Password
login.button=Login
login.error.invalid=Invalid username or password
