# SITE PROJECT: jsonplaceholder (API-only — no browser, no page objects)
# Only put things here that are DIFFERENT from global.properties
# =========================================================
#
# JSONPlaceholder (https://jsonplaceholder.typicode.com) is a free, stable,
# publicly hosted fake REST API — chosen specifically as the reference
# example for an API-only site because it needs no account, no API key,
# and no site-specific cleanup (every write is a no-op fake on the
# server side), so JsonPlaceholderApiTest is a self-contained, always-
# runnable demonstration of this framework's API testing layer that
# isn't coupled to any one real product's endpoints. Swap this "url" for
# your own service's base URL to reuse the same pattern for a real
# internal API — see docs/extending.md's "Adding a New API-Only Site"
# section for the full checklist.

site.name=jsonplaceholder
url=https://jsonplaceholder.typicode.com
