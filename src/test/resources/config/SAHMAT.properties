site.name=SAHMAT
url=https://staging2.pmgatishakti.gov.in/PermissionPortal/

# This site's CAPTCHA font trips up llava on exact case/letter-vs-digit
# reads (e.g. lowercase read back as upper, digits confused with letters).
# The framework's own segmented-OCR pipeline has dedicated fixes for that
# exact failure mode (applyRelativeCaseCorrection height-ratio check,
# resolveConfusableByShape geometric tiebreak) and reads this font more
# reliably than llava does — so disable AI Vision for this site only and
# let SOLVE_TEXT_CAPTCHA(_IF_PRESENT) use OCR. captcha.ai.enabled stays
# true globally for other sites/experiments.
captcha.ai.enabled=false
