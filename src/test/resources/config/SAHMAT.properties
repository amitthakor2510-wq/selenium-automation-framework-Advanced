# =========================================================
# SITE PROJECT: SAHMAT
# Only put things here that are DIFFERENT from global.properties
# =========================================================

site.name=SAHMAT
url=https://staging2.pmgatishakti.gov.in/PermissionPortal/

# This site's CAPTCHA font trips up llava on exact case/letter-vs-digit
# reads (e.g. lowercase read back as upper, digits confused with letters).
# The framework's own segmented-OCR pipeline has dedicated fixes for that
# exact failure mode (applyRelativeCaseCorrection height-ratio check,
# resolveConfusableByShape geometric tiebreak) and reads this font more
# reliably than llava does — so disable AI Vision for this site only and
# let SOLVE_TEXT_CAPTCHA(_IF_PRESENT) use OCR. captcha.ai.enabled stays
# true globally for other sites/experiments.
captcha.ai.enabled=false

# SAHMAT's CAPTCHA solver (AI Vision and the OCR fallback) has not been
# reading this site's font reliably, so this is set to false: CAPTCHA
# entry pauses and waits for you to type the answer manually in the
# browser instead of trusting the automated solve. Flip to true once the
# solver is trusted for this site again — no other code changes needed,
# this is the only switch. See global.properties' captcha.automation.enabled
# doc comment and CaptchaSolver.waitForManualCaptchaEntry() for how it works.
captcha.automation.enabled=true

# --- The two settings below were previously (and wrongly) placed in
# objectrepository/SAHMAT.properties, which is loaded by ObjectRepository
# for locator resolution ONLY — ConfigReader (what CaptchaSolver actually
# reads captcha.* keys through) never loads that file at all, so these
# two lines were silently dead: SAHMAT's OCR pipeline was running on
# global.properties' defaults (captcha.expected.length=0 = "unknown,
# don't enforce a count"; captcha.text.charset including symbols this
# site's CAPTCHA never has) instead of the values below, which is why
# every real run was solving the CAPTCHA wrong. Moved here so
# ConfigReader (config/SAHMAT.properties, loaded for -Dsite=SAHMAT) picks
# them up for real.

# Restrict OCR whitelist to strictly letters and digits (no symbols)
captcha.text.charset=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789

# Tell the solver to expect exactly 5 characters (enables grid fallback).
# Confirmed from a real captured CAPTCHA screenshot (text_captcha_20260820_114152.png,
# answer "fx7bx") - was previously guessed as 6 before the site was reachable.
# Getting this right matters beyond the grid fallback: splitTouchingCharacters()
# also divides the image's total ink width by this number to estimate one
# character's width, then force-splits any component wider than that
# estimate. With the old value of 6 (one too many), that per-char estimate
# was too narrow, so the "7" - a naturally wide glyph - was being sliced in
# two and misread as "T2" (observed: "fxT2x" instead of "fx7bx"). If a real
# run ever shows CAPTCHAs of a different length, prefer wiring the input
# field's own maxlength/DOM maxLength (see resolveExpectedLength()) over
# bumping this static fallback - it's live per-page and won't drift out of
# sync with the actual site like this value just did.
captcha.expected.length=5
