# =========================================================
# SITE PROJECT: demoqa
# Only put things here that are DIFFERENT from global.properties
# =========================================================

site.name=demoqa
url=https://demoqa.com

# demoqa's React tables (esp. /books) are slow to render, often due to
# ad-slot loading delaying JS execution. Global default of 10s is too
# tight and causes intermittent NoSuchElementException on [role='table'].
timeout=20

# WireMock record mode (-Dmock.enabled=true -Dmock.record=true) — see docs/api-mocking.md.
# Only the stateless catalogue reads are worth recording: replaying one fixed answer for
# account/collection calls can't reproduce a create -> add -> read -> delete chain (new IDs every
# run), so those are served by core/mock/DemoQaBookStoreFake instead.
mock.record.urlPattern=/BookStore/v1/Books?.*
