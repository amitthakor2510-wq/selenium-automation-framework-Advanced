# =========================================================
# GLOBAL DEFAULTS - shared by every site project
# Site-specific files (e.g. demoqa.properties) can override
# any of these keys. Any key can also be overridden at run
# time with -Dkey=value (see ConfigReader).
# =========================================================

browser=chrome
headless=false
timeout=10

# Long timeout for elements with known delays (e.g. timer alerts, dynamic buttons)
timeout.long=15

# How long UploadDownloadPage.clickDownloadAndVerify() polls for a
# downloaded file to appear before giving up. Raise this on slow CI
# runners or for large test downloads.
download.wait.seconds=10
# ---------------------------------------------------------
# HUMAN PAUSE ENGINE
# ---------------------------------------------------------
# Master switch. When false, ALL human pauses (step-level,
# post-success, post-failure) are skipped -> fast CI runs.
# Set -Dhuman.pause.enabled=false on the command line to skip
# pauses entirely for a given run without editing this file.
human.pause.enabled=true

# Random delay window (ms) used between UI interactions
# (click/type) performed through HumanActions.
human.pause.min=100
human.pause.max=300

# Random delay window (ms) used after a test finishes
# (success or failure) - gives external systems / screen
# recorders a moment before the browser closes.
human.pause.postTest.min=150
human.pause.postTest.max=400

# Delay window (ms) used specifically while typing text,
# applied per keystroke chunk in HumanActions.typeHumanLike().
human.pause.typing.min=10
human.pause.typing.max=30

# ---------------------------------------------------------
# FILE UPLOAD/DOWNLOAD PATHS
# ---------------------------------------------------------
# Download folder path (can be overridden per site or via -D flag)
# Defaults to: user's Downloads folder, or './target/downloads' if not available
download.folder.path=target/downloads

# Upload file path (used for testing; point to a file that exists)
upload.file.path=target/test-upload.txt
# ---------------------------------------------------------
# RETRY
# ---------------------------------------------------------
# Number of times a failed test is retried before marking
# it as failed. Set to 0 to disable retry entirely.
retry.count=2

# ---------------------------------------------------------
# SELENIUM GRID / DOCKER
# ---------------------------------------------------------
# When true, DriverFactory opens a RemoteWebDriver session against
# grid.url instead of launching a local browser binary. This is how
# the framework runs inside docker-compose (see docker-compose.yml,
# which points this at the selenium-hub service). Override per run
# with -Dgrid.enabled=true -Dgrid.url=http://localhost:4444/wd/hub
grid.enabled=false
grid.url=http://localhost:4444/wd/hub

# ---------------------------------------------------------
# DATA-DRIVEN TESTING (DDT) FILTERS
# ---------------------------------------------------------
# Optional comma-separated tag filter applied by DataProvider when a
# data file has a "tags" column, e.g. -Ddata.tags=smoke,regression
# Leave blank to run all rows regardless of tag.
data.tags=

# Column name DataProvider checks to decide whether to skip a data row.
# Rows where this column resolves to no/false/0/skip (case-insensitive)
# are excluded and logged instead of being sent to the test.
data.execute.column=execute

# ---------------------------------------------------------
# SELF-HEALING LOCATORS (see core/selfhealing/SelfHealingEngine.java)
# ---------------------------------------------------------
# Master switch. When true (default), BasePage.waitVisible/waitClickable,
# HumanActions.click/type, KeywordEngine's element resolution, and
# SmartLocator's last-resort fallback all recover automatically when a
# locator that used to work stops matching anything — by re-finding the
# element via similarity against the fingerprint captured the last time
# that exact locator succeeded (this run, or a previous one — see
# self-healing.repository.path). Set -Dself-healing.enabled=false to fall
# back to plain fail-on-first-miss behavior, e.g. when debugging whether a
# failure is a genuine break vs. markup drift.
self-healing.enabled=true

# Minimum similarity score (0.0-1.0) a candidate element must reach to be
# accepted as a healed match. Lower = heals more aggressively but risks
# matching the wrong element; higher = safer but heals fewer real drifts.
self-healing.threshold=0.55

# Where known-good element fingerprints are persisted between runs, and
# where the end-of-run summary of every locator that had to be healed is
# written. Both are relative to the working directory unless absolute.
#
# repository.path is deliberately NOT under target/ (unlike report.path,
# which is a per-run report meant to be archived and is fine there): every
# CI pipeline here runs `mvn clean` before tests, which deletes target/
# wholesale, so a repository path inside it never actually survived to the
# next run — self-healing was silently only ever working within a single
# run, never across runs as documented in LocatorRepository's class Javadoc.
self-healing.repository.path=self-healing-data/locator-repository.json
self-healing.report.path=target/self-healing/healing-report.json

# Visual/screenshot fallback (see VisualHasher). When DOM attribute/text
# scoring alone doesn't clear self-healing.threshold, this blends in a
# perceptual screenshot-hash comparison against a small pool of candidates —
# recovers elements DOM scoring structurally can't (icon-only buttons with
# no id/name/stable text, or an element whose tag itself changed, e.g.
# <button> -> <div role="button">). Off by default: turning it on costs one
# extra element screenshot on every successful find (not just on a heal),
# since that's when the comparison baseline gets captured — pay that cost
# deliberately for suites where recovering those cases is worth it.
self-healing.visual.enabled=false

# How much weight the screenshot-hash similarity gets vs. the DOM score when
# blending the two (0.0 = visual stage never actually influences the
# outcome; 1.0 = DOM score is ignored once visual healing kicks in).
self-healing.visual.weight=0.5

# ---------------------------------------------------------
# API TESTING (RestAssured, see core/api/ApiClient.java)
# ---------------------------------------------------------
# When true (default), request/response bodies are only printed to the
# log when an assertion fails — keeps CI output readable on chained
# flows like BookStoreApiTest's 9-call sequence. Set to false locally
# (-Dapi.log.onFailureOnly=false) to see every request/response while
# debugging a new API test.
api.log.onFailureOnly=true

# ---------------------------------------------------------
# VIDEO RECORDING (see core/utils/VideoRecorder.java)
# ---------------------------------------------------------
# Master switch. Off by default: recording only captures anything real
# when the browser is actually rendering to a display (headless=false,
# with a real desktop or an Xvfb virtual one on CI) — a headless=true run
# has nothing on-screen for java.awt.Robot to capture, so leaving this on
# by default for normal fast CI runs would just burn CPU/disk for a blank
# video. Override with -Dvideo.enabled=true (CI pipelines expose this as
# a RECORD_VIDEO parameter that also forces headless off + wraps the run
# with xvfb-run — see Jenkinsfile/github-ci.yml/.gitlab-ci.yml).
video.enabled=false

# Only web (BaseTest/DriverProvider) tests are recorded in this pass —
# MobileBaseTest/Appium tests are not, since Appium has its own native
# startRecordingScreen()/stopRecordingScreen() device-recording API that
# works completely differently from a desktop screen grab and is left as
# a follow-up.
video.fps=10

# Whether to keep the recording for a PASSED test. false (default) deletes
# a passing test's video right after the run to save disk — same
# report-only-on-failure philosophy as the framework's on-failure
# screenshots/page-source/console-log attachments. Set true to always keep
# recordings for manual review.
video.keep.on.pass=false

# Output directory for raw per-test video files before they're attached to
# Allure/Extent. Namespaced by site+thread the same way DriverFactory's
# temp profile dirs / chromedriver logs already are, so parallel test
# threads never race on the same file.
video.output.dir=target/videos

# ---------------------------------------------------------
# CaptchaSolver (SOLVE_TEXT_CAPTCHA / SOLVE_MATH_CAPTCHA / SOLVE_CAPTCHA_WITH_AI)
# ---------------------------------------------------------
# Left unset by default — CaptchaSolver auto-detects the tessdata directory
# (TESSDATA_PREFIX env var, then common per-OS tesseract-ocr install paths,
# Linux included, since this project's own Docker image runs Linux). Only
# set this if auto-detection picks the wrong install or tesseract lives
# somewhere non-standard, e.g.:
# tesseract.datapath=/usr/share/tesseract-ocr/5/tessdata

# Automatic CAPTCHA detection/solve, on top of the explicit
# SOLVE_TEXT_CAPTCHA/SOLVE_MATH_CAPTCHA/SOLVE_CAPTCHA_WITH_AI keywords.
# When true (default), BasePage.navigateTo() (every web Page Object, old and
# new), KeywordEngine's NAVIGATE step, and BaseMobilePage.handleCaptchaIfPresent()
# all scan the current page/screen for a text/math image CAPTCHA and solve
# it automatically with zero test-specific wiring. It is a no-op in the
# (overwhelming majority) case where no CAPTCHA is present, and it never
# fails a test on its own — see CaptchaSolver.autoSolveIfPresent() and
# docs/CAPTCHA_SOLVER.md. Set false to disable globally, e.g. for a suite
# that intentionally wants to assert on CAPTCHA-blocked behavior itself
# (see RegistrationPage.isBlockedByRecaptcha()).
captcha.autoDetect.enabled=true

# AI Vision CAPTCHA solving (CaptchaSolver.resolveWithVisionApi). Off by
# default so a fresh checkout with no API key still runs OCR unchanged.
#
# When true, SOLVE_TEXT_CAPTCHA / SOLVE_TEXT_CAPTCHA_IF_PRESENT try AI Vision
# FIRST and fall back to Tesseract OCR only if the API call itself fails
# (missing/invalid key, network error, etc.) — never on a low-confidence
# read. SOLVE_CAPTCHA_WITH_AI always uses AI Vision regardless of this flag.
# Use AI Vision for CAPTCHAs where OCR keeps misreading specific glyph
# shapes (e.g. n/m, 0/O, 1/l/I confusion on a distorted/wavy font) even
# after preprocessing tuning — that distortion is specifically designed to
# defeat classical OCR, which a vision-capable LLM handles far better.
#
# captcha.ai.provider: "anthropic" (default) or "ollama". Set to "ollama"
# to call a local/remote Ollama server's /api/generate instead of the
# Anthropic Messages API — different request/response JSON shape, handled
# natively by CaptchaSolver, no API key required.
# captcha.ai.apiKey: falls back to the ANTHROPIC_API_KEY environment
# variable if unset here — prefer the env var over committing a real key to
# this file. NEVER commit a real key value to source control. Not required
# for captcha.ai.provider=ollama (only sent as a Bearer token if you DO set
# one, e.g. for a reverse proxy in front of a remote Ollama box).
# captcha.ai.model: required if captcha.ai.enabled=true or if
# SOLVE_CAPTCHA_WITH_AI is used anywhere — set to a vision-capable model you
# have access to (e.g. llava for Ollama).
# captcha.ai.endpoint: defaults to https://api.anthropic.com/v1/messages for
# provider=anthropic, or http://localhost:11434/api/generate for
# provider=ollama — override if your Ollama server is on another host/port.
captcha.ai.enabled=True
captcha.ai.provider=ollama
captcha.ai.endpoint=http://192.168.2.17:11434/api/generate
captcha.ai.apiKey=
captcha.ai.model=minicpm-v

# ---------------------------------------------------------
# OCR accuracy pipeline (used whenever AI Vision is disabled/unavailable —
# see CaptchaSolver's class javadoc, "OCR ACCURACY PIPELINE", for the full
# explanation). Nothing here needs to be touched for a typical CAPTCHA; the
# defaults are safe no-ops on images that don't need the extra processing.
# ---------------------------------------------------------

# Per-character segmentation: isolates every character in the CAPTCHA and
# OCRs each one alone (instead of as part of the whole string), which is
# what actually fixes letter/digit confusion (0/O, 1/I/l, 5/S, 6/G, 8/B,
# 9/g...) — reading one glyph at a time means neighbouring strokes can't
# bleed into the recognition window the way they do with whole-string OCR.
# Automatically skipped (falls back to whole-string OCR) for any image that
# doesn't cleanly separate into minChars-maxChars components.
captcha.segmentation.enabled=true
captcha.segmentation.minChars=3
captcha.segmentation.maxChars=12
# Whitespace padding (px) added around each isolated character crop before
# OCR-ing it alone.
captcha.segmentation.paddingPx=6
# Extra upscale factor applied to each single-character crop on top of
# preprocessImage()'s own 2x upscale of the full image.
captcha.segmentation.upscale=4
# Connected components smaller than (median component area * this ratio)
# are treated as background noise/speckle and dropped before segmentation.
# Raise this for a very noisy CAPTCHA generator; lower it if legitimately
# small/thin characters (e.g. "l", "1", ".") are being filtered out.
captcha.segmentation.minComponentAreaRatio=0.12
# Minimum Tesseract confidence (0-100) a single isolated character needs
# before its read is trusted; below this the whole segmented result is
# abandoned in favour of whole-string OCR for that image.
captcha.segmentation.confidenceFloor=35.0
# Height ratio (a character's own height / the tallest digit-or-shape-
# distinct-letter "anchor" character in the same CAPTCHA) below which a
# shape-symmetric letter (C/c, O/o, S/s, U/u, V/v, W/w, X/x, Z/z — same
# glyph shape upper vs lower case, only size differs) is corrected to
# lower-case. Isolating and upscaling each character independently (the
# fix for glyph-shape confusion above) otherwise throws away the only
# signal that distinguishes case for these letters, which is why e.g. a
# lowercase "z" was being typed as "Z" before this was added.
captcha.segmentation.caseHeightRatio=0.78
# The CAPTCHA answer's exact character count, if known and fixed for this
# site — used to catch a segmentation over/under-read (extra noise picked
# up as a fake glyph, or one glyph split into two) that would otherwise
# still pass the broad minChars/maxChars range check above. Usually you
# don't need to set this: CaptchaSolver reads the answer input field's own
# HTML maxlength attribute automatically per-call and uses that instead when
# present (see CaptchaSolver.resolveExpectedLength()) — this static value is
# only a fallback for a site whose CAPTCHA field has a known fixed length
# but no maxlength attribute set in the DOM. Leave blank/0 to disable.
captcha.expected.length=0

# Decorative box/rule border removal: some CAPTCHA templates draw a thin
# rectangular border around the whole image, which findConnectedComponents()
# would otherwise pick up as one giant "character" (it's hollow, but its
# bounding box spans nearly the full image) and try to OCR, corrupting the
# whole read. A component is dropped as a border frame only when BOTH its
# width and height cover at least minDimRatio of the image AND its fill
# density is at or below maxDensity (a thin outline is mostly empty inside;
# a real glyph, even in a thin font, is much denser than this).
# Calibrated directly against two real india.ai CAPTCHA screenshots: the
# same border template measured wRatio~0.91/hRatio~0.74 (not symmetric —
# the screenshot margin sits more on the vertical axis) and density
# 0.057-0.151 (varied by rendering weight) across the two images, so both
# defaults below carry real margin past the measured worst case rather
# than the originally-assumed 0.85/0.15, which missed the border on both.
captcha.segmentation.borderFrame.removalEnabled=true
captcha.segmentation.borderFrame.minDimRatio=0.65
captcha.segmentation.borderFrame.maxDensity=0.22

# Touching/overlapping character splitting: some fonts render two (or
# more) adjacent characters close enough to merge into a single connected
# component. A component at least widthRatio times one real character's
# estimated width in this image (from the answer field's known length
# when available, otherwise the median component width) is checked for a
# per-column ink-count valley in its middle band; a convincing valley (no
# more than valleyMaxRatio of the component's own peak ink column, AND
# leaving both halves no narrower than 40% of that estimated character
# width) is treated as the boundary between two glyphs and split there.
# Each half is then re-checked the same way, so a component fusing 3+
# characters gets split down to all of them, not left as still-merged
# pairs. Lower valleyMaxRatio to be more conservative (fewer splits);
# raise widthRatio if legitimately wide single characters (e.g. "M"/"W")
# are being split incorrectly.
captcha.segmentation.touchingChars.splitEnabled=true
captcha.segmentation.touchingChars.widthRatio=1.6
captcha.segmentation.touchingChars.valleyMaxRatio=0.35

# Additional preprocessing passes ahead of the existing median-filter
# denoise + Otsu threshold — both help segmentation separate characters
# more cleanly, not just whole-string OCR.
# deskew: searches a small rotation range and straightens a CAPTCHA strip
# rendered at a slight angle before OCR/segmentation runs.
captcha.preprocessing.deskew.enabled=true
# lineRemoval: erases long, thin decorative strike-through/underline lines
# some CAPTCHA generators draw across the text specifically to defeat OCR
# (only lines that don't already touch/merge with a character stroke — see
# CaptchaSolver.removeLongThinLines() javadoc for the honest limitation).
captcha.preprocessing.lineRemoval.enabled=true
