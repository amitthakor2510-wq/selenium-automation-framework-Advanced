# =========================================================
# SITE PROJECT: apitest (no-code API testing — no browser, no page objects)
# Requests live in spec files, not Java. See docs/API_NO_CODE_GUIDE.md.
# Only put things here that are DIFFERENT from global.properties.
# =========================================================

site.name=apitest

# Placeholder only. The real base URL comes from -Dapi.base.url=..., the spec's `baseUrl:`,
# or `./Scripts/api-test.sh --base-url ...`. (BaseApiTest requires some `url` to exist.)
url=http://localhost

# Where spec files (*.yml / *.yaml / *.json / *.csv) are looked up
api.spec.dir=src/test/resources/apitests

# Where the one-page HTML report is written
api.report.dir=target/api-report

# Optional defaults (uncomment to use)
#api.retry.count=1
#api.spec.maxTimeMs=3000
#api.spec.tags=smoke
