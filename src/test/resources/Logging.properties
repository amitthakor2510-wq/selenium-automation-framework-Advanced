# Silences Selenium's own java.util.logging (JUL) warnings that fire when
# the locally installed Chrome is newer than the CDP command classes this
# Selenium release bundles, e.g.:
#   WARNING: Unable to find CDP implementation matching 150
#   WARNING: Unable to find version of CDP to use for 150.0.7871.128 ...
#
# These come straight from ChromeDriver/ChromiumDriver construction itself
# (org.openqa.selenium.devtools.CdpVersionFinder), before any of our own
# code runs, so they can't be avoided from inside AlertsPage.java or any
# other page object — they have to be turned off at the logging-config
# level instead. They are harmless: AlertsPage.java already has its own
# version-gated CDP attempt with an Alert.sendKeys() fallback, so no
# behavior depends on the CDP command classes actually matching.
handlers=java.util.logging.ConsoleHandler
.level=INFO
java.util.logging.ConsoleHandler.level=INFO

org.openqa.selenium.devtools.CdpVersionFinder.level=SEVERE
org.openqa.selenium.chromium.ChromiumDriver.level=SEVERE