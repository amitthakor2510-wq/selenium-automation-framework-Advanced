# ReportPortal agent configuration (com.epam.reportportal:agent-java-testng
# — see pom.xml's dependency block and
# src/test/resources/META-INF/services/org.testng.ITestNGListener, which
# registers the listener this file configures).
#
# STATIC defaults only below — this project does NOT enable Maven resource
# filtering (no <filtering>true</filtering> on testResources; see
# allure.properties for the same "literal default value" pattern), so a
# ${...} placeholder here would land in the compiled classpath resource
# completely unresolved, literally, instead of being substituted. That's
# fine: the client-java loader that reads this file at runtime overrides it
# in this order, each level replacing the last —
#   1. This file
#   2. Environment variables (dotted names upper-cased with underscores,
#      e.g. rp.api.key -> RP_API_KEY)
#   3. JVM -D system properties (highest priority)
# — so every value below is just the safe fallback for a plain local
# `mvn test`; the values that actually matter in CI are the -D overrides
# surefire forwards from the pom.xml <reportportal.*> properties (see
# systemPropertyVariables there), the exact same mechanism already used for
# allure.results.directory / self-healing.report.path / coverage.map.enabled.
# Override any of them per-run with -Dreportportal.<name>=..., same as
# -Dsite/-Dbrowser already work.

# Off by default so a plain local `mvn test` never tries to reach a
# ReportPortal server (and never fails/warns when one isn't configured).
# CI flips this to true only on legs where the RP_API_KEY secret is
# actually configured — see github-ci.yml's REPORTPORTAL_ENABLE env var.
rp.enable = false

rp.endpoint =
rp.project =
rp.launch = Selenium Automation Framework

# Semicolon-separated key:value pairs — CI sets this per matrix leg (site,
# browser/platform, suite type, CI run id) so parallel legs reporting under
# the same rp.launch name stay filterable/distinguishable in the RP UI,
# mirroring how TestListener already labels the same dimensions onto Allure.
rp.attributes =

# rp.api.key is deliberately NOT listed here and NEVER forwarded as a -D
# system property (system properties are visible in process listings and
# build logs). It's supplied purely as the RP_API_KEY environment variable
# — set as a job-level `env:` on the CI runner (see github-ci.yml), which
# the forked surefire JVM inherits automatically like any other OS env var,
# same as it would for any plain child process, no pom.xml/
# systemPropertyVariables wiring needed for it at all. A developer running
# locally with RP pointed at a real server exports the same env var by hand;
# it is never written to a file that gets committed.

## Everything below is an optional tuning knob, left at the agent's own
## built-in default (commented out) rather than duplicated here — see
## https://github.com/reportportal/client-java#configuration for the full
## list if you need to change one.
# rp.reporting.async = true
# rp.batch.size.logs = 20
# rp.rerun = false
