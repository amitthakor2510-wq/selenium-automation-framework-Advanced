# ================================================================
# GitLab CI/CD Pipeline - Selenium Automation Framework
# Allure report published via GitLab Pages
# ================================================================

# No image was declared before, so every job ran on the runner's bare
# shell executor with no JDK/Maven at all — `mvn` failed immediately
# with "command not found" before a single test could run. Pin a
# Debian-based Maven+Temurin17 image (matches the JDK 17 used by every
# other pipeline in this repo) so apt-get/gpg/wget below all work too.
image: maven:3.9.9-eclipse-temurin-17

stages:
  - build
  - test
  - report
  - pages

variables:
  SITE: "demoqa"
  SUITE_TYPE: "regression"
  BROWSER: "chrome"
  HEADLESS: "true"
  RETRY_COUNT: "0"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

# ================================================================
# STAGE 1 - Build
# ================================================================
build:
  stage: build
  script:
    - echo "======= Building Project ======="
    - mvn -B clean compile test-compile
  only:
    - main
    - master
    - merge_requests

# ================================================================
# STAGE 2 - Test
# ================================================================
test:
  stage: test
  script:
    - echo "======= Running Tests ======="
    - echo "Site=$SITE Suite=$SUITE_TYPE Browser=$BROWSER Headless=$HEADLESS"
    # Previously this just exited 1 if Chrome was missing instead of
    # installing it, which meant the test stage could never pass on a
    # fresh/ephemeral runner (the normal case for GitLab shared
    # runners — they don't retain packages between jobs). Actually
    # install it here, the same way the GitHub Actions pipeline does,
    # using the modern apt-key-free (signed-by) method since apt-key
    # is removed on current Debian/Ubuntu base images.
    - |
      if ! command -v google-chrome &> /dev/null; then
        echo "Chrome not found - installing..."
        apt-get update -qq
        apt-get install -y -qq wget gnupg
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
        apt-get update -qq
        apt-get install -y -qq google-chrome-stable
      fi
      echo "Chrome: $(google-chrome --version)"
    - mvn -B test
      -Dsite=$SITE
      -DsuiteXmlFile=testng-suites/$SITE-$SUITE_TYPE.xml
      -Dbrowser=$BROWSER
      -Dheadless=$HEADLESS
      -Dhuman.pause.enabled=false
      -Dretry.count=$RETRY_COUNT
      -Dmaven.test.failure.ignore=true
  artifacts:
    name: "test-results-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 7 days
    paths:
      - target/allure-results/
      - target/extent-reports/
      - target/screenshots/
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/*.xml
  only:
    - main
    - master
    - merge_requests

# ================================================================
# STAGE 3 - Report
# Allure → GitLab Pages  |  Extent → artifact
# ================================================================
report:
  stage: report
  script:
    - echo "======= Generating Allure Report ======="
    - |
      if [ ! -d "target/allure-results" ] || [ -z "$(ls -A target/allure-results 2>/dev/null)" ]; then
        echo "WARNING: target/allure-results is missing or empty — test job produced no allure results."
        mkdir -p target/allure-results
      fi
    - |
      if ! wget -q -O allure-2.27.0.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz; then
        echo "ERROR: failed to download Allure CLI (check runner internet access / DNS / proxy)."
        exit 1
      fi
    - |
      if [ ! -s allure-2.27.0.tgz ]; then
        echo "ERROR: downloaded Allure CLI archive is empty (likely blocked/rate-limited)."
        exit 1
      fi
    - mkdir -p allure-cli
    - tar -xzf allure-2.27.0.tgz -C allure-cli --strip-components=1
    - export PATH="$PWD/allure-cli/bin:$PATH"
    - mkdir -p public/allure-report
    - allure generate target/allure-results --clean -o public/allure-report
    - echo "======= Test Results Summary ======="
    - |
      if [ -f "target/surefire-reports/testng-results.xml" ]; then
        grep -o 'total="[0-9]*"' target/surefire-reports/testng-results.xml || true
        grep -o 'passed="[0-9]*"' target/surefire-reports/testng-results.xml || true
        grep -o 'failed="[0-9]*"' target/surefire-reports/testng-results.xml || true
        grep -o 'skipped="[0-9]*"' target/surefire-reports/testng-results.xml || true
      fi
  artifacts:
    name: "allure-report-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 30 days
    paths:
      - public/
      - target/extent-reports/
      - target/screenshots/
    reports:
      junit: target/surefire-reports/*.xml
  dependencies:
    - test
  only:
    - main
    - master
pages:
  stage: pages  # ← was "report"
  script:
    - echo "Publishing to GitLab Pages"
  artifacts:
    paths:
      - public/
  dependencies:
    - report
  only:
    - main
    - master