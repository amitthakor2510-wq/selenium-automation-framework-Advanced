#include:
#- template: Security/SAST.gitlab-ci.yml

# ================================================================
# GitLab CI/CD Pipeline - Selenium Automation Framework
# Allure report published via GitLab Pages
# ================================================================

# `image:` only takes effect on docker/kubernetes executors. This
# runner is confirmed (from actual job logs) to be a shell executor —
# "Preparing the shell executor... Using Shell (bash) executor" — so
# this line has NO effect here: mvn/apt-get/gpg/wget all come from
# whatever's actually installed on the host (bisagn) directly, not from
# this image. Left in place only so this same file still works
# unmodified if it's ever run on a docker-executor runner instead. Every
# apt-get call below is guarded to check for root/passwordless-sudo
# first and fail with clear instructions rather than a raw permission
# error, since this host's gitlab-runner account has neither.
image: maven:3.9.9-eclipse-temurin-17

stages:
  - config
  - build
  - test
  - report
  - pages

# Both quality gates below reuse the same pom.xml executions the docs
# describe as opt-in via `mvn verify` (see docs/reports-and-quality.md) —
# invoked directly here as `plugin:goal@executionId` instead so neither
# one re-runs the full test suite a second time just to reach the verify
# phase. checkstyle-check needs only the .java source tree (no browser,
# no compiled classes); jacoco-merge/jacoco-check need the jacoco.exec
# files the test/mobile-test jobs already produced.

variables:
  SUITE_TYPE: "regression"
  BROWSER: "chrome"
  HEADLESS: "true"
  RETRY_COUNT: "0"
  # Off by default — see global.properties' video.enabled comment for why
  # (blank/pointless under headless=true, and adds CPU/disk cost). Set to
  # "true" as a pipeline variable (Run Pipeline > Variables, or CI/CD
  # Settings) to enable; the `test` stage below forces HEADLESS to "false"
  # and wraps mvn with xvfb-run whenever this is "true", since recording
  # a headless browser just captures a blank display.
  RECORD_VIDEO: "false"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  # WebDriverManager's default cache lives at $HOME/.wdm — for this image
  # that's /root/.wdm, which sits OUTSIDE $CI_PROJECT_DIR and so can't be
  # named in `cache:.paths` below (GitLab only caches paths inside the
  # project directory). Redirect it into the project dir instead so the
  # driver-binary cache actually persists between pipeline runs, the same
  # way .m2/repository already does.
  WDM_CACHE_PATH: "$CI_PROJECT_DIR/.wdm"
  # Overridable via a CI/CD variable (Settings > CI/CD > Variables) once
  # the team is ready to gate merges on it — see the security-scan job
  # below and the "security" profile's comment in pom.xml. 11 = never
  # fails the build (report-only), 7 is a common "fail on High/Critical"
  # cutoff.
  SECURITY_FAIL_CVSS: "11"
  # ReportPortal — see pom.xml's <reportportal.*> properties and
  # src/test/resources/reportportal.properties for the framework side
  # (agent dependency + ServiceLoader-registered listener, already a
  # complete no-op unless enabled). Off by default, same as RECORD_VIDEO
  # above — flip REPORTPORTAL_ENABLE to "true" as a project/group CI/CD
  # variable (Settings > CI/CD > Variables) once RP_API_KEY (see below),
  # REPORTPORTAL_ENDPOINT, and REPORTPORTAL_PROJECT are also configured
  # there. Any of these three set as a protected/masked CI/CD variable of
  # the same name overrides the default here — GitLab applies project
  # variables on top of this file's `variables:` block, not the other way
  # round. REPORTPORTAL_ENDPOINT/REPORTPORTAL_PROJECT are left blank here
  # (not secret, but meaningless without RP_API_KEY too).
  #
  # RP_API_KEY itself is deliberately NOT declared here at all — GitLab
  # CI/CD variables set at project/group level (Settings > CI/CD >
  # Variables, marked Masked + Protected) are injected as ordinary
  # environment variables into every job automatically; nothing in this
  # file needs to reference it explicitly for it to reach the forked
  # surefire JVM (which inherits the job's env the same way any child
  # process does), and declaring it here with any value — even blank —
  # would just create a second, unmasked copy that shows up in job logs.
  REPORTPORTAL_ENABLE: "false"
  REPORTPORTAL_ENDPOINT: ""
  REPORTPORTAL_PROJECT: ""

# A superseded pipeline (e.g. a second push to the same MR before the
# first pipeline finished) cancels the older one instead of letting both
# run to completion. Jenkins gets the equivalent via
# disableConcurrentBuilds(), GitHub Actions via `concurrency:`.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - when: always

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/
    - .wdm/
    - .android-sdk/

# ================================================================
# STAGE 0 - Read the master site on/off switch
# ================================================================
# pipeline-config.properties (repo root) is the SAME file GitHub
# Actions' matrix-setup job and Jenkins' "Discover Site Projects" stage
# read via Scripts/enabled-sites.sh, and the same file
# SiteRegistry.validate() enforces for local `mvn test` runs. Disabling
# a site there is the only edit needed anywhere — this job just makes
# that decision visible to the jobs below via a dotenv artifact, since
# GitLab's `parallel: matrix:`/`rules:` are evaluated before any script
# runs and can't read an arbitrary file directly.
#
# SITE_<NAME>_ENABLED is emitted per registered site (SiteRegistry.
# KNOWN_SITES); a job's `rules:` below reads the one it cares about.
# Any job with `needs: ["generate-pipeline-config"]` gets these
# variables available in its own `rules:`, not just its `script:`.
generate-pipeline-config:
  stage: config
  interruptible: true
  script:
    - echo "======= Reading pipeline-config.properties ======="
    - bash Scripts/enabled-sites.sh --dotenv | tee site-flags.env
  artifacts:
    reports:
      dotenv: site-flags.env
    expire_in: 1 hour
  only:
    - branches
    - merge_requests
    - schedules

# ================================================================
# STAGE 1 - Build
# ================================================================
build:
  stage: build
  interruptible: true
  script:
    - echo "======= Building Project ======="
    - mvn -B clean compile test-compile
  only:
    - branches
    - merge_requests

# ================================================================
# STAGE 1b - Code Quality (Checkstyle)
# ================================================================
# Same `test` stage as the browser/mobile jobs below so it runs in
# parallel with them rather than serially gating them — a style
# violation shouldn't block seeing whether the suite itself still
# passes, and this needs nothing the browser jobs produce.
checkstyle:
  stage: test
  interruptible: true
  script:
    - echo "======= Running Checkstyle (checkstyle.xml) ======="
    - mvn -B checkstyle:check@checkstyle-check
  only:
    - branches
    - merge_requests

# ================================================================
# STAGE 2 - Test (one job instance per site, running in parallel)
# ================================================================
test:
  stage: test
  interruptible: true
  # Needs the dotenv artifact from generate-pipeline-config so
  # SITE_DEMOQA_ENABLED/SITE_SAUCEDEMO_ENABLED are available to the
  # `rules:` below. GitLab's `parallel: matrix:` values themselves must
  # stay static/hardcoded here (rules are evaluated before any script
  # runs, so unlike GitHub Actions' fromJSON(needs.*.outputs.*) or
  # Jenkins' shell-based discovery, this list can't be generated from
  # pipeline-config.properties directly) — but whether each generated
  # instance actually executes is fully config-driven below.
  needs: [ "generate-pipeline-config" ]
  rules:
    # AUTO-GENERATED-SITE-RULES-START — Scripts/new-site.sh inserts each new
    # site's disable-rule directly after this marker (`sed ... /marker/a`).
    # This marker was previously missing from this file entirely, so the
    # script's GitLab-wiring step silently failed for every site scaffolded
    # before this fix (SAHMAT included) — it always fell through to the
    # "[✗] Could not find the AUTO-GENERATED-SITE-LIST marker" message and
    # left both this rules: block and the site matrix list below for a
    # human to edit by hand, contradicting the script's own "no CI/CD file
    # needs manual editing" success banner. Do not remove or reword this
    # marker line — the script matches its exact text.
    - if: '$SITE == "demoqa" && $SITE_DEMOQA_ENABLED == "false"'
      when: never
    - if: '$SITE == "saucedemo" && $SITE_SAUCEDEMO_ENABLED == "false"'
      when: never
    - if: '$SITE == "SAHMAT" && $SITE_SAHMAT_ENABLED == "false"'
      when: never
    # Replaces the old `only: [branches, merge_requests]` — rules: and
    # only:/except: can't coexist on the same job, so that condition
    # moves here instead of being dropped.
    - if: '$CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID'
      when: on_success
  parallel:
    matrix:
      # Every site that has a <site>-<suite>.xml under testng-suites/ runs
      # as its own parallel job instance, cross-joined with every browser —
      # previously this pipeline only ever tested "demoqa" against Chrome
      # via a hardcoded SITE/BROWSER variable, so neither "saucedemo" nor
      # firefox/edge had any CI coverage despite the framework fully
      # supporting them (the GitHub Actions pipeline already covers all
      # six site x browser combinations). "SAHMAT" (testng-suites/
      # SAHMAT-{smoke,regression}.xml) was added the same way once those
      # suite files existed — GitLab's `parallel: matrix:` values can't be
      # generated from pipeline-config.properties the way GitHub Actions'
      # matrix-setup job or Jenkins' shell-based discovery can (see the
      # comment on `needs:`/`rules:` above), so a new site always needs
      # one line added here; whether each instance actually executes stays
      # fully config-driven via the `rules:` block above. 3 sites x 3
      # browsers = 9 parallel job instances (before pipeline-config.properties
      # filtering above — a disabled site's 3 instances are skipped via
      # `rules:`, not removed from this list, so re-enabling it needs no
      # edit here).
      # AUTO-GENERATED-SITE-LIST — Scripts/new-site.sh appends each new site
      # into the site matrix line below (regex-matched on "SITE:", not
      # marker-anchored, but this comment's presence is what the script
      # checks for before attempting the edit at all — see the rules: block
      # above for why the marker was missing until now).
      - SITE: [ demoqa, saucedemo, SAHMAT ]
        BROWSER: [ chrome, firefox, edge ]
  script:
    - 'echo "======= Running Tests: site=$SITE browser=$BROWSER ======="'
    - echo "Site=$SITE Suite=$SUITE_TYPE Browser=$BROWSER Headless=$HEADLESS"
    # Install-if-missing, split per browser (same pattern as the GitHub
    # Actions pipeline's Setup Chrome/Verify Firefox/Setup Edge steps) so
    # a fresh/ephemeral runner — the normal case for GitLab shared
    # runners, which don't retain packages between jobs — can pass on
    # any of the three, not just chrome.
    - |
      if [ "$(id -u)" = "0" ]; then
        SUDO=""
      elif sudo -n true 2>/dev/null; then
        SUDO="sudo"
      else
        SUDO="__NONE__"
      fi
      install_guard() {
        if [ "$SUDO" = "__NONE__" ]; then
          echo "ERROR: $1 not installed, and this job has no root/sudo access to install it."
          echo "One-time fix on this host: install $1 yourself once (see docs/configuration.md), then re-run this job."
          exit 1
        fi
      }
      case "$BROWSER" in
        chrome)
          if ! command -v google-chrome &> /dev/null; then
            echo "Chrome not found - installing..."
            install_guard "Chrome"
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq wget gnupg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | $SUDO gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | $SUDO tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq google-chrome-stable
          fi
          echo "Chrome: $(google-chrome --version)"
          ;;
        firefox)
          # Most Debian/Ubuntu base images ship Firefox as a pre-installed
          # snap/apt package already, which GeckoDriver can drive
          # directly — install only if it's genuinely missing, same
          # install-if-missing pattern as the other two browsers.
          if ! command -v firefox &> /dev/null; then
            echo "Firefox not found - installing..."
            install_guard "Firefox"
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq firefox-esr || $SUDO apt-get install -y -qq firefox
          fi
          echo "Firefox: $(firefox --version 2>/dev/null || firefox-esr --version)"
          ;;
        edge)
          if ! command -v microsoft-edge-stable &> /dev/null; then
            echo "Edge not found - installing..."
            install_guard "Edge"
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq wget gnupg
            wget -q -O - https://packages.microsoft.com/keys/microsoft.asc | $SUDO gpg --dearmor -o /usr/share/keyrings/microsoft-edge-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge-keyring.gpg] https://packages.microsoft.com/repos/edge stable main" | $SUDO tee /etc/apt/sources.list.d/microsoft-edge.list > /dev/null
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq microsoft-edge-stable
          fi
          echo "Edge: $(microsoft-edge-stable --version)"
          ;;
      esac
    # CaptchaSolver (Tess4J) needs the native tesseract-ocr binary + trained
    # data on the runner itself — this job runs mvn directly on the runner,
    # not through this repo's Dockerfile, so without this step every
    # SOLVE_TEXT_CAPTCHA/SOLVE_MATH_CAPTCHA keyword AND every BasePage/
    # KeywordEngine auto-detect pass fails fast with "Could not locate a
    # tessdata directory" (ConfigException) the first time a page has one.
    # Same install-guard pattern as the browser install above: only touches
    # apt if tesseract is genuinely missing, and fails with a clear one-time
    # fix instead of a cryptic permission error if this runner has no root/sudo.
    - |
      if ! command -v tesseract &> /dev/null; then
        echo "tesseract-ocr not found - installing..."
        if [ "$SUDO" = "__NONE__" ]; then
          echo "ERROR: tesseract-ocr not installed, and this job has no root/sudo access to install it."
          echo "One-time fix on this host: sudo apt-get install -y tesseract-ocr tesseract-ocr-eng, then re-run this job."
          exit 1
        fi
        $SUDO apt-get update -qq
        $SUDO apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
      fi
      echo "tesseract: $(tesseract --version 2>&1 | head -1)"
    # RECORD_VIDEO forces headless off (nothing to record under
    # headless=true) and installs Xvfb so java.awt.Robot has a virtual
    # display to grab even on a display-less shell-executor host — same
    # reasoning as the GitHub Actions pipeline's "Install Xvfb for video
    # recording" step.
    - |
      EFFECTIVE_HEADLESS="$HEADLESS"
      MVN_RUNNER=""
      if [ "$RECORD_VIDEO" = "true" ]; then
        EFFECTIVE_HEADLESS="false"
        if [ "$SUDO" != "__NONE__" ] && ! command -v xvfb-run &> /dev/null; then
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq xvfb
        fi
        if command -v xvfb-run &> /dev/null; then
          MVN_RUNNER="xvfb-run -a"
        else
          echo "WARNING: RECORD_VIDEO=true but xvfb-run is unavailable and couldn't be installed — recordings will be skipped (VideoRecorder no-ops without a display)."
        fi
      fi
    # -Dallure.results.directory=target/allure-results/$SITE-$BROWSER —
    # GitLab automatically merges artifacts from every parallel:matrix
    # instance of this job for any downstream job that declares
    # `dependencies: [test]`. Allure's own result files are UUID-named so
    # that merge is safe on its own, but environment.properties/
    # categories.json (written once per JVM by AllureEnvironmentWriter)
    # are NOT — two instances both writing to the same shared
    # target/allure-results/environment.properties would leave the merged
    # report's "Environment" widget showing only whichever instance's
    # file happened to survive the merge. Each site+browser combination
    # gets its own subdirectory instead; see the "report" stage below for
    # how they're combined back together for `allure generate`.
    # -Dself-healing.report.path=target/self-healing/$SITE-$BROWSER-healing-report.json —
    # same site+browser scoping as -Dallure.results.directory above, and the
    # same reasoning as -Dsurefire.reportsDirectory in the Jenkinsfile/GitHub
    # Actions pipelines (see the surefire.reportsDirectory property comment
    # in pom.xml): without a scoped path, all 6 matrix instances would write
    # the same shared target/self-healing/healing-report.json, and on this
    # runner class (a persistent shell executor reusing one workspace, not a
    # fresh container per job) concurrent instances can genuinely race on
    # that file, not just risk an artifact-merge ambiguity. This was
    # previously not set at all here, so every run silently used the
    # unscoped default from global.properties.
    - $MVN_RUNNER mvn -B test
      -Dsite=$SITE
      -DsuiteXmlFile=testng-suites/$SITE-$SUITE_TYPE.xml
      -Dbrowser=$BROWSER
      -Dheadless=$EFFECTIVE_HEADLESS
      -Dvideo.enabled=$RECORD_VIDEO
      -Dhuman.pause.enabled=false
      -Dretry.count=$RETRY_COUNT
      -Dallure.results.directory=target/allure-results/$SITE-$BROWSER
      -Dself-healing.report.path=target/self-healing/$SITE-$BROWSER-healing-report.json
      -Dwdm.cachePath=$WDM_CACHE_PATH
      -Dreportportal.enable=$REPORTPORTAL_ENABLE
      -Dreportportal.endpoint=$REPORTPORTAL_ENDPOINT
      -Dreportportal.project=$REPORTPORTAL_PROJECT
      -Dreportportal.launch="Selenium Automation Framework"
      -Dreportportal.attributes="site:$SITE;browser:$BROWSER;suite:$SUITE_TYPE;ci:gitlab;pipeline:$CI_PIPELINE_ID"
      -Dmaven.test.failure.ignore=true
    # Same collision the comment above describes for surefire's
    # testng-results.xml applies to a bare target/jacoco.exec too — every
    # matrix instance would write that same path, and GitLab's artifact
    # merge keeps only one of them. Only the chrome leg feeds the
    # coverage gate (same core/ classes get exercised regardless of which
    # browser ran them, so one exec per site is enough — matches the
    # GitHub Actions pipeline's "chrome leg only" jacoco upload) rather
    # than merging three redundant copies of the same coverage per site.
    - |
      if [ "$BROWSER" = "chrome" ]; then
        mkdir -p target/jacoco-artifacts
        cp target/jacoco.exec target/jacoco-artifacts/$SITE.exec
      fi
  artifacts:
    name: "test-results-$CI_JOB_NAME-$SITE-$BROWSER-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 7 days
    paths:
      - target/allure-results/
      - target/extent-reports/
      - target/logs/
      - target/screenshots/
      - target/surefire-reports/
      - target/jacoco-artifacts/
      - target/videos/
      - target/self-healing/
    reports:
      # NOTE: each matrix instance's own target/surefire-reports/testng-results.xml
      # lands at the same path, so GitLab's artifact merge keeps only one
      # instance's copy for the JUnit report widget/summary grep below —
      # not a combined total. The individual per-class XML files (and the
      # Allure report, which IS fully merged) are unaffected.
      junit: target/surefire-reports/*.xml

# ================================================================
# STAGE 2b - Mobile Test (Android emulator + Appium)
# ================================================================
# Separate job rather than a third `SITE` matrix entry above, since it
# needs a completely different toolchain (Android SDK + emulator +
# Appium instead of a browser) — squeezing it into the same script would
# either skip Chrome setup for nothing or fail trying to install it for a
# job that never uses it.
mobile-test:
  stage: test
  interruptible: true
  needs: [ "generate-pipeline-config" ]
  rules:
    - if: '$SITE_MOBILE_ENABLED == "false"'
      when: never
    # Replaces the old `only: [branches, merge_requests]` — see the
    # matching comment on the `test` job above for why this moved here.
    - if: '$CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID'
      when: on_success
  # Emulator-boot flakiness on a shared runner (no /dev/kvm, resource
  # contention, etc. — see the WARNING/exit 1 further down) is
  # infrastructure flake, not a real functional regression, same as the
  # perf-smoke job's own allow_failure below. Without this, a bad boot
  # hard-fails this job, and because `report`/`pages` run in the later
  # `report`/`pages` stages, that blocks them from running at all — the
  # same failure mode fixed in the Jenkins pipeline's Mobile Test stage
  # (see Jenkinsfile's catchError there for the full reasoning).
  allow_failure: true
  # This runner is a persistent shared shell host (not an isolated
  # container), and every run uses the same hardcoded AVD name and the
  # same Appium port (4723). Without this, two overlapping runs (a quick
  # follow-up push, a manual retry, etc.) race on that same AVD/port —
  # and the before_script/after_script `pkill -f "appium"` below then
  # kills the OTHER run's already-healthy Appium server out from under
  # it, well after that run's own readiness check passed. That produces
  # a plain ConnectException/ClosedChannelException at newSession time
  # (Appium simply isn't there anymore) rather than a real driver/test
  # failure — confirmed by this exact failure mode. A fixed (not
  # per-ref) resource_group value queues any overlapping run instead of
  # letting two instances share the host at once.
  resource_group: mobile-emulator-bisagn
  variables:
    ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
    ANDROID_AVD_NAME: "gitlab_ci_avd"
    # avdmanager/emulator default to $HOME/.android/avd, which is outside
    # the .android-sdk/ cache path declared above — every run would
    # recreate the AVD from scratch. Point them at a location that IS
    # inside the cached tree instead.
    ANDROID_AVD_HOME: "$CI_PROJECT_DIR/.android-sdk/avd"
  # This runner is a shell executor on a persistent host (bisagn), not a
  # fresh container per run — a leftover `emulator`/`appium` process from
  # a killed/timed-out/failed job would otherwise sit there indefinitely,
  # holding the emulator port and 4723 hostage and breaking every
  # subsequent run. Clear any stragglers before starting, and clean up
  # after regardless of how this job ends.
  #
  # ROOT CAUSE FIX (real failure: "error: more than one device/emulator"
  # right at `adb wait-for-device`, before this run's own emulator had even
  # finished booting): `pkill -f "emulator.*-avd $ANDROID_AVD_NAME"` alone
  # only ever matches the short-lived `emulator` launcher process. On
  # Linux, once that launcher has actually started the AVD it hands off to
  # (execs into) a `qemu-system-x86_64` process — a DIFFERENT process
  # name/argv that the "emulator.*-avd" pattern no longer matches at all.
  # So a prior run that didn't get a clean after_script (a cancelled job, a
  # runner-host restart mid-run, resource_group only stops a NEW job from
  # overlapping — it does nothing for a leftover process from a run that's
  # already dead) leaves that qemu-system-x86_64 process running
  # indefinitely, invisible to this pkill. The next run's before_script
  # then "succeeds" at killing nothing, launches its own emulator, and the
  # freshly-started adb server immediately sees BOTH the stale qemu process
  # and the new one — any un-scoped `adb` call (wait-for-device included)
  # then fails outright with "more than one device/emulator" instead of
  # picking one. This is the identical process-naming gotcha the Jenkins
  # pipeline's Mobile Test stage already killall's qemu-system-x86_64 for
  # (see Jenkinsfile's "Killing any orphaned node/adb/qemu/chrome
  # processes..." step) — that hardening was never ported over here.
  # Matching it now: kill the real long-running process by name first (-9,
  # not a bare pkill — the Jenkinsfile fix notes a hung emulator can
  # outlive a plain SIGTERM), THEN the launcher-process pattern as a
  # secondary safety net for a run that's still mid-launch.
  before_script:
    - killall -9 qemu-system-x86_64 2>/dev/null || true
    - sleep 1
    - pkill -9 -f "emulator.*-avd $ANDROID_AVD_NAME" 2>/dev/null || true
    - pkill -9 -f "appium" 2>/dev/null || true
  after_script:
    - killall -9 qemu-system-x86_64 2>/dev/null || true
    - pkill -9 -f "emulator.*-avd $ANDROID_AVD_NAME" 2>/dev/null || true
    - pkill -9 -f "appium" 2>/dev/null || true
  script:
    - echo "======= Running Mobile Tests ======="
    # mobile.properties is deliberately gitignored (real local device
    # values, not something to commit) — a fresh clone never has it, but
    # SiteRegistry.validate("mobile") requires it to exist before any
    # mobile test starts, even though this job overrides every value that
    # matters via -D flags below. Materialize it from the tracked
    # .example template, same as the GitHub Actions / Jenkins mobile jobs.
    - cp src/test/resources/config/mobile.properties.example src/test/resources/config/mobile.properties
    # apt-get needs root, and this runner's gitlab-runner service account
    # doesn't have it (confirmed by a real failure: "Could not open lock
    # file /var/lib/apt/lists/lock - Permission denied"). Rather than
    # crash on that error, check first and fail with a clear one-time fix
    # if these aren't already present — a lot cheaper than debugging a
    # cryptic apt permission error again.
    - |
      need_pkgs=""
      command -v unzip &> /dev/null || need_pkgs="$need_pkgs unzip"
      command -v wget &> /dev/null || need_pkgs="$need_pkgs wget"
      if [ -n "$need_pkgs" ]; then
        if [ "$(id -u)" = "0" ]; then
          apt-get update -qq && apt-get install -y -qq $need_pkgs
        elif sudo -n true 2>/dev/null; then
          sudo apt-get update -qq && sudo apt-get install -y -qq $need_pkgs
        else
          echo "ERROR: missing required packages:$need_pkgs — and this job has no root/sudo access to install them."
          echo "One-time fix on this host: run as an admin:"
          echo "  sudo apt-get update && sudo apt-get install -y$need_pkgs"
          echo "Then re-run this job."
          exit 1
        fi
      fi
    # Same install-if-missing pattern as the Chrome step in the `test` job
    # above — cached across runs via .android-sdk/ in the global `cache:`
    # block, so this only actually downloads anything on a cold cache.
    - |
      if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
        echo "Android SDK not found - installing cmdline-tools..."
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        wget -q -O cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
        rm cmdline-tools.zip
      fi
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
    - yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
    - sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "emulator" "system-images;android-30;default;x86_64" "platforms;android-30" > /dev/null
    - |
      mkdir -p "$ANDROID_AVD_HOME"
      if [ ! -d "$ANDROID_AVD_HOME/${ANDROID_AVD_NAME}.avd" ]; then
        echo "no" | avdmanager create avd -n "$ANDROID_AVD_NAME" -k "system-images;android-30;default;x86_64" --force
      fi
    # This runner is the same class of shared persistent host (no
    # guaranteed real KVM passthrough) that the Jenkins pipeline's Mobile
    # Test stage was hardened against: a bare "does /dev/kvm exist" check
    # isn't enough, because a host can have /dev/kvm present yet still not
    # pass through the vmx/svm/aes CPU flags the guest needs — the
    # emulator then boots INTERNALLY ("Boot completed in NNNN ms" in
    # emulator.log) while adbd's own late-boot crypto/keystore init never
    # finishes, leaving the device stuck "offline" forever instead of
    # failing fast or falling back cleanly. Explicitly forcing "-accel
    # off" (software mode) whenever any of those checks fail avoids that
    # half-broken state, matching the Jenkinsfile's own capability check.
    - |
      ACCEL_MODE="off"
      if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ] \
         && grep -qE '^flags\s*:.*\baes\b' /proc/cpuinfo 2>/dev/null \
         && grep -qE '^flags\s*:.*\b(vmx|svm)\b' /proc/cpuinfo 2>/dev/null; then
        ACCEL_MODE="on"
        echo "KVM + required CPU virtualization/AES-NI flags detected — using hardware acceleration."
      else
        echo "WARNING: this runner can't offer full hardware acceleration (missing /dev/kvm access, or the host isn't passing through vmx/svm/aes CPU flags to the guest). Forcing '-accel off' (software mode) instead of leaving it on 'auto', which has been known to land in a half-broken state where the guest boots internally but adbd never comes online."
      fi
      $ANDROID_SDK_ROOT/emulator/emulator -avd $ANDROID_AVD_NAME -accel $ACCEL_MODE -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none > emulator.log 2>&1 &
      echo "Waiting for emulator to boot..."
      # -accel off trades speed for reliability, so a cold software-
      # emulated boot needs a much wider budget than a working hardware-
      # accelerated one gets — matching the Jenkinsfile's own scaling
      # (300s/60 polls on hardware accel, 900s/180 polls forced off).
      WAIT_SECS=300
      POLL_ITERS=60
      if [ "$ACCEL_MODE" = "off" ]; then
        WAIT_SECS=900
        POLL_ITERS=180
      fi
      if ! timeout $WAIT_SECS "$ANDROID_SDK_ROOT/platform-tools/adb" wait-for-device; then
        echo "ERROR: emulator did not come up within ${WAIT_SECS}s — it may have crashed. Check emulator.log below."
        cat emulator.log 2>/dev/null || true
        exit 1
      fi
      # adb wait-for-device above only requires the device to be
      # REGISTERED — it can still be stuck "offline" and never reach
      # sys.boot_completed=1, exactly the failure signature above.
      # Without this explicit BOOTED guard, a device that stays offline
      # for the whole loop below fell through silently into starting
      # Appium and running mvn test against a half-booted device, which
      # produces confusing Appium/test failures instead of a clear
      # infra-timeout diagnosis (same fix already applied in Jenkinsfile).
      BOOTED=0
      for i in $(seq 1 $POLL_ITERS); do
        boot_completed=$("$ANDROID_SDK_ROOT/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
        if [ "$boot_completed" = "1" ]; then
          echo "Emulator booted"
          BOOTED=1
          break
        fi
        sleep 5
      done
      if [ "$BOOTED" != "1" ]; then
        echo "ERROR: emulator registered but never reached sys.boot_completed=1 within ${WAIT_SECS}s — likely still 'offline' (see adb devices below). Check emulator.log."
        "$ANDROID_SDK_ROOT/platform-tools/adb" devices || true
        cat emulator.log 2>/dev/null || true
        exit 1
      fi
    - |
      # Don't `apt-get install npm` here — on a NodeSource-installed
      # nodejs (which is what this host actually has), npm ships bundled
      # in the same package. Separately apt-installing the Debian-archive
      # `npm` package conflicts with that (it depends on ~25 node-*
      # Debian packages that don't exist alongside a NodeSource install)
      # and apt refuses the whole transaction — confirmed by a real run.
      if ! command -v node &> /dev/null; then
        if [ "$(id -u)" = "0" ]; then
          apt-get install -y -qq nodejs
        elif sudo -n true 2>/dev/null; then
          sudo apt-get install -y -qq nodejs
        else
          echo "ERROR: node not installed, and this job has no root/sudo access to install it."
          echo "One-time fix on this host: run 'sudo apt-get install -y nodejs' yourself once, then re-run this job."
          exit 1
        fi
      fi
      if ! command -v npm &> /dev/null; then
        echo "ERROR: node is installed but npm isn't — that's unusual for a NodeSource install."
        echo "Check 'node -v' and 'npm -v' manually on this host; don't apt-get install npm separately, it conflicts with NodeSource's bundled npm."
        exit 1
      fi
    - |
      if ! command -v appium &> /dev/null; then
        npm install -g appium
      fi
      # Checked independently of the appium binary above: this runner is a
      # persistent shell executor (not a fresh container per run), so a prior
      # run may have already installed appium without the uiautomator2 driver
      # sticking around (or a newer appium install wiping driver state) —
      # nesting this inside the `command -v appium` check meant it only ever
      # ran once, ever, on this host, which is exactly what produced
      # "Could not find a driver for automationName 'UiAutomator2'".
      if ! appium driver list --installed 2>&1 | grep -qi uiautomator2; then
        appium driver install uiautomator2
      fi
    - appium --log-timestamp --log-no-colors > appium.log 2>&1 &
    - |
      for i in $(seq 1 30); do
        if curl -s http://127.0.0.1:4723/status > /dev/null; then
          echo "Appium is up"
          break
        fi
        echo "Waiting for Appium... ($i)"
        sleep 2
      done
    - mvn -B test
      -Dsite=mobile
      -DsuiteXmlFile=testng-suites/mobile-$SUITE_TYPE.xml
      -Dmobile.app.package=com.android.settings
      -Dmobile.app.activity=.Settings
      -Dmobile.device.name=$ANDROID_AVD_NAME
      -Dretry.count=$RETRY_COUNT
      -Dallure.results.directory=target/allure-results/mobile
      -Dself-healing.report.path=target/self-healing/mobile-healing-report.json
      -Dreportportal.enable=$REPORTPORTAL_ENABLE
      -Dreportportal.endpoint=$REPORTPORTAL_ENDPOINT
      -Dreportportal.project=$REPORTPORTAL_PROJECT
      -Dreportportal.launch="Selenium Automation Framework"
      -Dreportportal.attributes="site:mobile;platform:android;suite:$SUITE_TYPE;ci:gitlab;pipeline:$CI_PIPELINE_ID"
      -Dmaven.test.failure.ignore=true
    - mkdir -p target/jacoco-artifacts
    - cp target/jacoco.exec target/jacoco-artifacts/mobile.exec
  artifacts:
    name: "test-results-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 7 days
    paths:
      - target/allure-results/
      - target/extent-reports/
      - target/logs/
      - target/screenshots/
      - target/surefire-reports/
      - target/jacoco-artifacts/
      - target/self-healing/
      - emulator.log
      - appium.log
    reports:
      junit: target/surefire-reports/*.xml

# ================================================================
# STAGE 2c - Nightly Accessibility + Visual-Regression (demoqa only)
# ================================================================
# Both suites are opt-in by nature (axe-core accessibility scanning and
# AShot screenshot diffing are both slower / more flake-prone than the
# regular functional suites) and only exist for demoqa, so they don't run
# on every commit — only on a scheduled pipeline. Create the schedule
# under Settings > CI/CD > Schedules (e.g. "0 2 * * *" targeting main) —
# that part can't be expressed in this YAML file, it's a one-time manual
# setup step in the GitLab UI.
accessibility-visual-test:
  stage: test
  interruptible: true
  needs: [ "generate-pipeline-config" ]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SITE_DEMOQA_ENABLED == "false"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  parallel:
    matrix:
      - EXTRA_SUITE: [ accessibility, visual ]
  script:
    - echo "======= Running Nightly demoqa $EXTRA_SUITE Suite ======="
    - |
      if [ ! -f "testng-suites/demoqa-$EXTRA_SUITE.xml" ]; then
        echo "testng-suites/demoqa-$EXTRA_SUITE.xml not found - skipping"
        exit 0
      fi
    - |
      if ! command -v google-chrome &> /dev/null; then
        if [ "$(id -u)" = "0" ]; then
          SUDO=""
        elif sudo -n true 2>/dev/null; then
          SUDO="sudo"
        else
          echo "ERROR: Chrome not installed, and this job has no root/sudo access to install it."
          echo "One-time fix on this host: install Chrome yourself once (see docs/configuration.md), then re-run this job."
          exit 1
        fi
        $SUDO apt-get update -qq
        $SUDO apt-get install -y -qq wget gnupg
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | $SUDO gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | $SUDO tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
        $SUDO apt-get update -qq
        $SUDO apt-get install -y -qq google-chrome-stable
      fi
    - mvn -B test
      -Dsite=demoqa
      -DsuiteXmlFile=testng-suites/demoqa-$EXTRA_SUITE.xml
      -Dbrowser=$BROWSER
      -Dheadless=$HEADLESS
      -Dallure.results.directory=target/allure-results/demoqa-$EXTRA_SUITE
      -Dwdm.cachePath=$WDM_CACHE_PATH
      -Dreportportal.enable=$REPORTPORTAL_ENABLE
      -Dreportportal.endpoint=$REPORTPORTAL_ENDPOINT
      -Dreportportal.project=$REPORTPORTAL_PROJECT
      -Dreportportal.launch="Selenium Automation Framework"
      -Dreportportal.attributes="site:demoqa;browser:$BROWSER;suite:$EXTRA_SUITE;ci:gitlab;pipeline:$CI_PIPELINE_ID"
      -Dmaven.test.failure.ignore=true
  artifacts:
    name: "test-results-$CI_JOB_NAME-$EXTRA_SUITE-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 7 days
    paths:
      - target/allure-results/
      - target/extent-reports/
      - target/logs/
      - target/screenshots/
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/*.xml

# ================================================================
# Security — OWASP Dependency-Check (mvn verify -Psecurity, see pom.xml)
# ================================================================
# Scans every resolved dependency against the NVD CVE database. First
# run downloads/builds that database locally and is slow (several
# minutes); subsequent runs reuse the cached copy from the `cache:`
# block above being extended, so this runs nightly (same trigger as
# accessibility-visual-test) rather than on every push — an unrelated
# dependency bump landing mid-review shouldn't have to wait on a
# multi-minute CVE-database rebuild just to merge. allow_failure: true
# and SECURITY_FAIL_CVSS defaults to 11 (never fails) — report-only
# until the team deliberately opts into gating merges on it, same
# reasoning as the profile's own comment in pom.xml.
# ================================================================
security-scan:
  stage: test
  interruptible: true
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - echo "======= Running OWASP Dependency-Check (mvn verify -Psecurity) ======="
    # -DskipTests: `verify` runs the whole default lifecycle, not just the
    # dependency-check goal — without this it also ran the full real-
    # browser TestNG suite (this job never installs a browser) plus the
    # allure-report/jacoco-check/checkstyle-check goals that already have
    # their own dedicated stages elsewhere in this pipeline, for no
    # benefit. See the same fix in .github/workflows/github-ci.yml's
    # security-scan job for the full explanation.
    #
    # -DnvdApiKey=$NVD_API_KEY: without an API key, NVD rate-limits
    # dependency-check to 5 requests/30s; with one, 50 requests/30s — this
    # is the actual difference between the "hours" this job used to take
    # and the few-minutes-first-run/seconds-after that NVD's own docs
    # describe. Requires an NVD_API_KEY CI/CD variable (Settings > CI/CD >
    # Variables, Masked + Protected) — get a free key at
    # https://nvd.nist.gov/developers/request-an-api-key. $NVD_API_KEY
    # resolves to empty if that variable isn't set yet, which mvn treats
    # the same as no key (see the <nvdApiKey> comment in pom.xml) — so
    # this is safe to merge before the variable exists, it just won't
    # speed anything up until it does.
    - mvn -B verify -Psecurity -DfailBuildOnCVSS=$SECURITY_FAIL_CVSS -DnvdApiKey=$NVD_API_KEY -DskipTests
  artifacts:
    name: "owasp-dependency-check-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 30 days
    paths:
      - target/dependency-check-report.html
      - target/dependency-check-report.json

# ================================================================
# Secret scanning — gitleaks
# ================================================================
# Runs on every push/MR (unlike security-scan above, this is fast — no
# CVE database to build) so a committed credential gets flagged before
# it merges, not discovered later on a nightly run. allow_failure: true
# for now: a repo's first-ever gitleaks run commonly turns up
# pre-existing/false-positive matches in history or test fixtures that
# need triage before this can safely block pushes — flip to false once
# that initial pass is clean (or a .gitleaksignore baseline is in
# place).
# ================================================================
secret-scan:
  stage: test
  interruptible: true
  allow_failure: true
  script:
    - echo "======= Running gitleaks secret scan ======="
    - |
      if ! command -v gitleaks &> /dev/null; then
        echo "gitleaks not found - installing..."
        GITLEAKS_VERSION="8.18.4"
        if ! wget -q -O gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"; then
          echo "ERROR: failed to download gitleaks (check runner internet access / DNS / proxy)."
          exit 1
        fi
        mkdir -p .gitleaks-bin
        tar -xzf gitleaks.tar.gz -C .gitleaks-bin gitleaks
        export PATH="$CI_PROJECT_DIR/.gitleaks-bin:$PATH"
      fi
    - gitleaks detect --source . --report-format json --report-path gitleaks-report.json --redact
  artifacts:
    name: "gitleaks-report-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 30 days
    paths:
      - gitleaks-report.json
  only:
    - branches
    - merge_requests

# ================================================================
# Test Impact Analysis — informational only, merge requests only
# ================================================================
# GitLab equivalent of .github/workflows/github-ci.yml's own
# `test-impact-analysis` job — see docs/TEST_IMPACT_ANALYSIS.md for the
# full design. Deliberately does NOT replace or gate the real `test`/
# `mobile-test` jobs above; this answers a narrower, faster question up
# front ("which test classes does com.automation.core.tia.
# TestImpactAnalyzer think this MR actually affects, and by how much
# could a filtered run have saved"). GitLab's own `report:` artifact
# types don't have a free-form-Markdown-to-MR-comment option the way
# GitHub Actions' $GITHUB_STEP_SUMMARY does, so the report is instead
# uploaded as a job artifact and echoed to the job log — posting it as
# an actual MR comment would need a GitLab API token wired in
# separately (e.g. via a `glab mr note` call) and is a reasonable follow-
# up once this job has run for a while and the report format is stable.
#
# GIT_DEPTH: 0 (full clone, overriding whatever shallow depth this
# project/runner defaults to) is required here — TIA diffs against the
# MR's merge-base commit, which a shallow clone commonly doesn't have
# locally, exactly the same reason the GitHub Actions job passes
# `fetch-depth: 0`. $CI_MERGE_REQUEST_DIFF_BASE_SHA is GitLab's own
# precomputed merge-base for the MR, so no extra `git fetch`/branch
# lookup is needed the way Jenkins' equivalent stage needs one.
# ================================================================
test-impact-analysis:
  stage: test
  interruptible: true
  allow_failure: true
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - 'echo "======= Test Impact Analysis: $CI_MERGE_REQUEST_DIFF_BASE_SHA...$CI_COMMIT_SHA ======="'
    - mvn -B -q compile test-compile
    - mvn -B -q exec:java@tia -Ptia
      -Dtia.base="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      -Dtia.head="$CI_COMMIT_SHA"
    - cat target/tia/impact-report.md
  artifacts:
    name: "test-impact-analysis-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - target/tia/

# ================================================================
# API Tests — pure-HTTP, no browser/Grid at all (testng-suites/api-tests*.xml)
# ================================================================
# GitLab equivalent of github-ci.yml's `api-tests` job / the Jenkinsfile's
# 'API Tests' stage — see either's own comment for the full reasoning.
# Runs on every branch/MR push, not just nightly: fast (seconds) and
# deterministic enough to gate merges on. One job instance per known API
# suite file via `parallel: matrix:` (values must stay static here, same
# limitation as the `test` job's SITE matrix above), each independently
# gated on its own site being enabled through the dotenv flags from
# generate-pipeline-config.
# ================================================================
api-tests:
  stage: test
  interruptible: true
  needs: [ "generate-pipeline-config" ]
  rules:
    - if: '$SITE == "demoqa" && $SITE_DEMOQA_ENABLED == "false"'
      when: never
    - if: '$SITE == "jsonplaceholder" && $SITE_JSONPLACEHOLDER_ENABLED == "false"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID'
      when: on_success
  parallel:
    matrix:
      - SITE: [ demoqa, jsonplaceholder ]
  script:
    - 'echo "======= Running API Tests: site=$SITE ======="'
    - |
      case "$SITE" in
        demoqa) SUITE_FILE="testng-suites/api-tests.xml" ;;
        jsonplaceholder) SUITE_FILE="testng-suites/api-tests-jsonplaceholder.xml" ;;
      esac
    - mvn -B test
      -Dsite=$SITE
      -DsuiteXmlFile=$SUITE_FILE
      -Dallure.results.directory=target/allure-results/$SITE-api
      -Dreportportal.enable=$REPORTPORTAL_ENABLE
      -Dreportportal.endpoint=$REPORTPORTAL_ENDPOINT
      -Dreportportal.project=$REPORTPORTAL_PROJECT
      -Dreportportal.launch="Selenium Automation Framework"
      -Dreportportal.attributes="site:$SITE;suite:api;ci:gitlab;pipeline:$CI_PIPELINE_ID"
      -Dmaven.test.failure.ignore=true
    - mkdir -p target/jacoco-artifacts
    - cp target/jacoco.exec target/jacoco-artifacts/$SITE-api.exec
  artifacts:
    name: "api-test-results-$SITE-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 7 days
    paths:
      - target/allure-results/
      - target/extent-reports/
      - target/logs/
      - target/surefire-reports/
      - target/jacoco-artifacts/
    reports:
      junit: target/surefire-reports/*.xml

# ================================================================
# Performance Tests — Java DSL load tests (core/perf, testng-suites/*-perf.xml)
# ================================================================
# GitLab equivalent of github-ci.yml's `perf-tests` job / the Jenkinsfile's
# 'Performance Tests - Java DSL (Nightly)' stage. Nightly-only
# (schedule-gated), same reasoning as perf-smoke below: response-time/
# error-rate budgets (PerfConfig) aren't fair to assert on every push
# against a shared runner. Distinct from perf-smoke, which stays the
# legacy JMeter XML sanity check.
# ================================================================
perf-tests:
  stage: test
  interruptible: true
  allow_failure: true
  needs: [ "generate-pipeline-config" ]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SITE == "demoqa" && $SITE_DEMOQA_ENABLED == "false"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SITE == "jsonplaceholder" && $SITE_JSONPLACEHOLDER_ENABLED == "false"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  parallel:
    matrix:
      - SITE: [ demoqa, jsonplaceholder ]
  script:
    - 'echo "======= Running Performance Tests (Java DSL): site=$SITE ======="'
    - |
      case "$SITE" in
        demoqa) SUITE_FILE="testng-suites/demoqa-perf.xml" ;;
        jsonplaceholder) SUITE_FILE="testng-suites/jsonplaceholder-perf.xml" ;;
      esac
    - mvn -B test
      -Dsite=$SITE
      -DsuiteXmlFile=$SUITE_FILE
      -Dgroups=perf
      -Dallure.results.directory=target/allure-results/$SITE-perf
      -Dreportportal.enable=$REPORTPORTAL_ENABLE
      -Dreportportal.endpoint=$REPORTPORTAL_ENDPOINT
      -Dreportportal.project=$REPORTPORTAL_PROJECT
      -Dreportportal.launch="Selenium Automation Framework"
      -Dreportportal.attributes="site:$SITE;suite:perf;ci:gitlab;pipeline:$CI_PIPELINE_ID"
      -Dmaven.test.failure.ignore=true
    - mkdir -p target/jacoco-artifacts
    - cp target/jacoco.exec target/jacoco-artifacts/$SITE-perf.exec
  artifacts:
    name: "perf-results-$SITE-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - target/allure-results/
      - target/perf-reports/
      - target/surefire-reports/
      - target/jacoco-artifacts/

# ================================================================
# Performance smoke — perf/basic-smoke.jmx via the pom.xml `perf` Maven
# profile (jmeter-maven-plugin resolves JMeter itself via Maven, into the
# already-cached .m2/repository/ — no separate download/cache needed).
# NOT a load/capacity test — see the .jmx file's own TestPlan.comments.
# A handful of threads hitting each site's home page, asserting HTTP 200
# and a response-time ceiling, as a fast "did this get noticeably slower"
# signal alongside the functional suites. allow_failure: true because a
# transient slow response from demoqa.com/saucedemo.com (sites this repo
# doesn't control) shouldn't block a pipeline the way a real functional
# regression should.
# ================================================================
perf-smoke:
  stage: test
  interruptible: true
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - echo "======= Running perf/basic-smoke.jmx (mvn verify -Pperf) ======="
    - mvn -B verify -Pperf
  artifacts:
    name: "perf-results-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 7 days
    paths:
      - target/jmeter/results/
      - target/jmeter/reports/

# ================================================================
# Coverage Gate (merged JaCoCo check across every SITE + mobile + api-tests)
# ================================================================
# Each test/mobile-test/api-tests instance only exercises the slice of
# core/ its own suite touches, so checking any single instance's
# jacoco.exec against the 50% core/ threshold in pom.xml would fail
# unfairly. Merges every SITE.exec + mobile.exec + SITE-api.exec captured
# above into one target/jacoco.exec, then runs the real gate against that
# union — same approach as the GitHub Actions pipeline's coverage-gate
# job. perf-tests' SITE-perf.exec artifacts are listed in dependencies:
# too for when they exist, but in practice this job's `only: [branches,
# merge_requests]` means it never actually runs in the same pipeline as
# perf-tests (schedule-only) — listing it is forward-looking/harmless
# rather than something currently in effect; see docs/roadmap.md.
coverage-gate:
  stage: report
  interruptible: true
  script:
    - echo "======= Merging coverage data ======="
    - |
      if [ ! -d "target/jacoco-artifacts" ] || [ -z "$(ls -A target/jacoco-artifacts 2>/dev/null)" ]; then
        echo "WARNING: no jacoco-artifacts found from test/mobile-test/api-tests — skipping coverage gate this run."
        exit 0
      fi
    - mkdir -p target/jacoco-raw
    - cp target/jacoco-artifacts/*.exec target/jacoco-raw/
    - mvn -B compile
    - mvn -B jacoco:merge@jacoco-merge
    - echo "======= Generating merged coverage report ======="
    - mvn -B jacoco:report@jacoco-report
    - echo "======= Enforcing coverage threshold (core/ >= 50% lines) ======="
    - mvn -B jacoco:check@jacoco-check
  artifacts:
    name: "jacoco-report-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - target/site/jacoco/
  dependencies:
    - test
    - mobile-test
    - api-tests
    - perf-tests
  only:
    - branches
    - merge_requests

# Allure → GitLab Pages  |  Extent → artifact
# ================================================================
report:
  stage: report
  interruptible: true
  script:
    - echo "======= Generating Allure Report ======="
    - |
      if [ ! -d "target/allure-results" ] || [ -z "$(ls -A target/allure-results 2>/dev/null)" ]; then
        echo "WARNING: target/allure-results is missing or empty — test job produced no allure results."
        mkdir -p target/allure-results/_empty
      fi
    - |
      if ! wget -q -O allure-2.27.0.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz; then
        echo "ERROR: failed to download Allure CLI (check runner internet access / DNS / proxy)."
        exit 1
      fi
    - |
      if [ ! -s allure-2.27.0.tgz ]; then
        echo "ERROR: downloaded Allure CLI archive is empty (likely blocked/rate-limited)."
        exit 1
      fi
    - mkdir -p allure-cli
    - tar -xzf allure-2.27.0.tgz -C allure-cli --strip-components=1
    - export PATH="$PWD/allure-cli/bin:$PATH"
    - mkdir -p public/allure-report
    # Pull the previously-published report's history/ folder from GitLab Pages so the
    # History/Duration/Retry trend widgets have something to plot against — otherwise every
    # pipeline run starts a brand-new trend from zero. continue-on-error via `|| true` since
    # there's nothing to fetch on the very first run (404 is expected and fine).
    - mkdir -p target/allure-results/_history/history
    - |
      for f in history.json history-trend.json duration-trend.json retry-trend.json categories-trend.json; do
        wget -q -O "target/allure-results/_history/history/$f" "${CI_PAGES_URL}/allure-report/history/$f" || rm -f "target/allure-results/_history/history/$f"
      done
    # Each site's results live in their own target/allure-results/<site>
    # subdirectory (see the "test" stage above) — Allure's CLI accepts
    # multiple results directories on one command line and combines them
    # into a single report, so glob every site's subdirectory in rather
    # than pointing at just target/allure-results itself. _history/ (fetched
    # above) rides along in that same glob purely to carry its history/
    # subfolder in — Allure looks for a "history" folder INSIDE whichever
    # results directory has one, not as a results dir passed on its own.
    - allure generate target/allure-results/*/ --clean -o public/allure-report
    # Extent's HTML report was being uploaded as a plain job artifact
    # (target/extent-reports/) but never copied into public/ — GitLab
    # Pages only ever serves what's inside public/, so Allure was the
    # only report that actually got a live URL. Mirror it in here too.
    # Done BEFORE the segmented-reports script below so that script's
    # landing page can list these at their real, final public/ location
    # (it only reads target/extent-reports to build links, doesn't copy it).
    - |
      if [ -d "target/extent-reports" ] && [ -n "$(ls -A target/extent-reports 2>/dev/null)" ]; then
        mkdir -p public/extent-report
        cp -r target/extent-reports/. public/extent-report/
      else
        echo "WARNING: target/extent-reports is missing or empty — no Extent report to publish."
      fi
    - |
      if [ -d "target/videos" ] && [ -n "$(ls -A target/videos 2>/dev/null)" ]; then
        # Belt-and-suspenders retention: this doesn't stop the branch/pipeline history from
        # growing (the `pages` job's own expire_in below handles that) but it does keep a
        # single run's own published videos bounded — RECORD_VIDEO left on across a long
        # regression run with many failures can otherwise leave hundreds of .avi files in
        # one deployment. Keeps the newest 10 "runs" (see ArtifactRetentionCleaner's javadoc
        # for what a "run" means here); safe to no-op (mvn not found, profile fails) since
        # this is best-effort housekeeping, not something that should fail the report job.
        mvn -q compile exec:java@prune-artifacts -Pprune-artifacts -Dprune.keepRuns=10 || true
        mkdir -p public/videos
        cp -r target/videos/. public/videos/
      fi
    # Browser-wise/site-wise/test-type-wise/category-wise/severity-wise/
    # flaky reports — see .github/workflows/scripts/generate_segmented_reports.py's
    # docstring. Reuses the same allure-cli just extracted above (on
    # PATH) rather than downloading a second copy; --skip-combined since
    # the `allure generate` line above already built the combined report.
    # Writes straight into public/ (not target/, then copied) so the
    # landing page's relative links resolve at their real published
    # location, and so it can double as public/index.html — GitLab Pages
    # has never had anything at its own site root before this, only at
    # specific report sub-paths. This image
    # (maven:3.9.9-eclipse-temurin-17) doesn't ship python3 by default —
    # install-if-missing, same guarded pattern the "test" stage already
    # uses for browsers.
    - |
      if ! command -v python3 &> /dev/null; then
        if [ "$(id -u)" = "0" ]; then
          apt-get update -qq && apt-get install -y -qq python3
        elif sudo -n true 2>/dev/null; then
          sudo apt-get update -qq && sudo apt-get install -y -qq python3
        else
          echo "WARNING: python3 not available and no root/sudo to install it — skipping segmented (by browser/site/type/category) Allure reports this run."
        fi
      fi
    - |
      if command -v python3 &> /dev/null; then
        python3 .github/workflows/scripts/generate_segmented_reports.py \
          --results-dir target/allure-results \
          --skip-combined \
          --output-dir public/allure-segmented \
          --combined-output public/allure-report \
          --extent-dir public/extent-report \
          --landing-page public/index.html
      fi
    - echo "======= Test Results Summary ======="
    - |
      if [ -f "target/surefire-reports/testng-results.xml" ]; then
        grep -o 'total="[0-9]*"' target/surefire-reports/testng-results.xml || true
        grep -o 'passed="[0-9]*"' target/surefire-reports/testng-results.xml || true
        grep -o 'failed="[0-9]*"' target/surefire-reports/testng-results.xml || true
        grep -o 'skipped="[0-9]*"' target/surefire-reports/testng-results.xml || true
      fi
    # Mirrors the GitHub Actions pipeline's compute_self_healing_summary.py:
    # surfaces every target/self-healing/<site>-healing-report.json this run
    # produced (now downloaded here via `dependencies: [test, mobile-test]`
    # above, since those jobs archive target/self-healing/ — see the
    # -Dself-healing.report.path additions in the test/mobile-test jobs).
    # SelfHealingReportWriter only writes a file when at least one locator
    # actually healed, so no files here is the common, expected case, not
    # an error — kept as a plain grep count (not a full JSON aggregation
    # script) since that's all this stage needs to make the drift visible.
    - |
      healed_files=$(find target/self-healing -name '*-healing-report.json' 2>/dev/null)
      if [ -n "$healed_files" ]; then
        total_healed=$(cat $healed_files | grep -o '"elementKey"' | wc -l)
        echo "Self-healing events this run: $total_healed (see target/self-healing/ artifacts for details)"
      else
        echo "Self-healing events this run: 0 (no locators drifted)"
      fi
  artifacts:
    name: "allure-report-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 30 days
    # target/extent-reports/, target/logs/, target/screenshots/ used to be
    # re-listed here too — but this job's own `dependencies: [test,
    # mobile-test]` already downloads them from those jobs' artifacts (see
    # their own `artifacts.paths` above), and this job never modifies them,
    # it only reads target/extent-reports to mirror it into
    # public/extent-report/ (already covered by public/ below). Re-archiving
    # them here just uploaded the same ~168 files a second time on every
    # run, padding this job's artifact size for nothing — a real
    # contributor to the "413 Request Entity Too Large" artifact-upload
    # failures alongside the Scripts/ path bug above.
    paths:
      - public/
    reports:
      junit: target/surefire-reports/*.xml
  # accessibility-visual-test only runs on scheduled pipelines (see its
  # `rules:` above) — on a normal push/MR pipeline that job never exists,
  # so listing it here made GitLab try to fetch artifacts from a job that
  # was never created, which is what produced the "unable to fetch data"
  # warning. It's opt-in/nightly-only, so its results aren't needed for
  # every regular report anyway.
  dependencies:
    - test
    - mobile-test
    - api-tests
    - perf-tests
  only:
    - branches
pages:
  stage: pages
  interruptible: true
  script:
    - echo "Publishing to GitLab Pages"
  artifacts:
    # GitLab Pages itself always serves the LATEST deployment only — it does not keep a
    # browsable history the way GitHub's gh-pages branch does. But the underlying job
    # artifact behind each deployment (this full copy of public/, videos included) is a
    # normal GitLab CI/CD artifact, and without an explicit expire_in it defaults to the
    # project's own "keep artifacts" setting, which on most projects means "forever" — so
    # every single pipeline run leaves behind its own full copy in GitLab's artifact
    # storage, growing without bound even though only the newest one is ever actually
    # served. expire_in here bounds that the same way every other job in this file already
    # bounds its own artifacts; see docs/RETENTION_POLICY.md for the full picture (this,
    # plus the target/videos/ pruning below, plus the equivalent gh-pages branch-history
    # squash on the GitHub Actions side).
    expire_in: 30 days
    paths:
      - public/
  dependencies:
    - report
  only:
    - branches
