# Coverage ratchet baseline — read by Scripts/coverage-ratchet.py (CI coverage-gate job).
#
# core.line.pct = the last measured merged LINE coverage of com.automation.core.* (percent).
# The gate fails when a run drops more than core.max.drop.pct points BELOW this value, so the
# bar rises with the code instead of staying at a fixed 60%. pom.xml's
# <jacoco.core.minLineCoverage> remains the absolute floor underneath it.
#
# Leave core.line.pct empty until the first merged run: the script then passes and prints the
# number to record. After that, raise it with:
#     python3 Scripts/coverage-ratchet.py --update
# (--update only ever moves the baseline UP, never down.) Commit the changed file.
core.line.pct=
core.max.drop.pct=1.0
