# ==================================================================
# MASTER SITE TOGGLE
# ==================================================================
# This is the ONE file you edit to turn a site on or off, anywhere in
# this project. Set enabled=false and that site disappears from:
#
#   - GitHub Actions   (.github/workflows/github-ci.yml)
#       matrix-setup no longer builds a job for it, coverage-map
#       skips it, mobile-test / accessibility-visual-test no-op if
#       the site they cover is disabled.
#   - Jenkins          (Jenkinsfile)
#       "Discover Site Projects" filters it out of SITES_TO_RUN /
#       RUN_MOBILE before the per-site loop even starts.
#   - GitLab CI         (.gitlab-ci.yml)
#       the generate-pipeline-config job exports it as a dotenv
#       variable that downstream jobs' `rules:` gate on.
#   - Local Maven runs  (mvn test -Dsite=<site>)
#       SiteRegistry.validate() (called from ConfigReader.init())
#       refuses a disabled site immediately with a clear message,
#       instead of quietly running it.
#
# You never need to touch a workflow file, the Jenkinsfile, or any
# Java source to disable/re-enable a site — just flip the value below.
#
# Format is deliberately dead simple (grep/sed/java.util.Properties
# can all read it with zero extra dependency, on any runner OS):
#
#     site.<name>.enabled=true|false
#
# One line per site, no spaces around "=". Read by:
#   - Scripts/enabled-sites.sh   (shared by all three CI systems)
#   - com.automation.core.config.SiteRegistry (Java/local runs)
#
# To ADD a new site: this file only controls on/off. You still need
# Scripts/new-site.sh to scaffold it and SiteRegistry.KNOWN_SITES to
# register what resources it requires — add a line here too (defaults
# to disabled if missing, see SiteRegistry's fail-safe).
# ==================================================================

site.demoqa.enabled=true
site.saucedemo.enabled=true
site.mobile.enabled=true
site.SAHMAT.enabled=true
# CI-only skip: SAHMAT's CAPTCHA solver needs the local Ollama AI vision model, which the
# GitHub/GitLab/Jenkins runners don't have. ci=false keeps it enabled for local runs but
# hides it from every pipeline (read by Scripts/enabled-sites.sh when it detects CI).
# Remove this line (or set ci=true) once a runner with Ollama access exists.
site.SAHMAT.ci=false
# API-only site (no UI/browser at all) — see SiteRegistry.KNOWN_SITES and
# config/jsonplaceholder.properties. Same on/off switch as every other
# site; disabling it here disables JsonPlaceholderApiTest everywhere
# (local runs, all three CI systems) the same way disabling site.demoqa
# would disable demoqa's suites. The "type=api" line is what tells
# Scripts/enabled-sites.sh --browser-only to exclude this site from the
# UI browser test matrix (see that script's own comment) — every other
# site has no "type=" line at all, which is treated as "browser site",
# so this is purely additive and changes no existing site's behavior.
site.jsonplaceholder.enabled=true
site.jsonplaceholder.type=api

# No-code API testing site (spec files / OpenAPI -> tests, see docs/API_NO_CODE_GUIDE.md and
# Scripts/api-test.sh). type=api keeps it out of the UI browser matrix like jsonplaceholder.
site.apitest.enabled=true
site.apitest.type=api

# ==================================================================
# TEST SHARDING (opt-in, duration-balanced) - see docs/sharding.md
# ==================================================================
# Splits ONE site's suite across several parallel CI jobs, balanced by how long
# each test class took in earlier runs (testng-suites/shard-durations.json).
# 1 = do not shard (default; pipelines behave exactly as before).
#   shard.count            default for every site (a repo Variable SHARD_COUNT
#                          in GitHub Actions is used when this line is absent)
#   shard.count.<site>     per-site override, wins over everything else
# Read by the GitHub Actions matrix-setup job. GitLab CI uses SHARD_TOTAL in
# .gitlab-ci.yml instead (its matrix must be static). Jenkins is not sharded.
# A suite is never split into more shards than it has test classes.
shard.count=1
#shard.count.saucedemo=3
