# Maven Wrapper configuration.
# https://maven.apache.org/wrapper/
#
# distributionUrl pins the exact Maven version every dev machine and CI
# agent builds with (3.9.6 — matches Dockerfile's maven:3.9.6-eclipse-temurin-17
# base image), instead of relying on whatever `mvn` happens to already be
# on each machine's PATH. Run `./mvnw ...` / `mvnw.cmd ...` instead of a
# bare `mvn` anywhere this project is built (local dev, Jenkins, GitLab CI,
# GitHub Actions) for a reproducible build.
#
# wrapperUrl is required explicitly here (not left to the script's own
# built-in default) because the built-in default in the plain mvnw/mvnw.cmd
# scripts is only filled in by Maven's own release tooling when this
# wrapper is generated via `mvn wrapper:wrapper` — a raw copy of those
# scripts (as used here) still has the unresolved @@project.version@@
# placeholder baked in. Both scripts read this property file and use its
# wrapperUrl in preference to that placeholder, so pinning it here is what
# actually makes `./mvnw` work correctly on first run.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.6/apache-maven-3.9.6-bin.zip
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
