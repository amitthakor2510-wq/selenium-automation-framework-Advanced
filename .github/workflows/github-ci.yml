env:
  SITE: "demoqa"
  SUITE_TYPE: "regression"
  BROWSER: "chrome"
  HEADLESS: "true"
  RETRY_COUNT: "0"
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository"

  name: GitHub Actions Pipeline - Selenium Automation Framework

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  SITE: "demoqa"
  SUITE_TYPE: "regression"
  BROWSER: "chrome"
  HEADLESS: "true"
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository"

jobs:
  # ================================================================
  # STAGE 1 - Build
  # ================================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Project
        run: |
          echo "======= Building Project ======="
          mvn -B clean compile test-compile

  # ================================================================
  # STAGE 2 - Test
  # ================================================================
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Chrome Browser
        run: |
          echo "======= Setting Up Browser ======="
          if ! command -v google-chrome &> /dev/null; then
            echo "Chrome not found - installing..."
            sudo apt-get update -qq
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
            echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq google-chrome-stable
          else
            echo "Chrome already installed: $(google-chrome --version)"
          fi

      - name: Run Tests
        run: |
          echo "======= Running Tests ======="
          mvn -B test \
            -Dsite=${{ env.SITE }} \
            -DsuiteXmlFile=testng-suites/${{ env.SITE }}-${{ env.SUITE_TYPE }}.xml \
            -Dbrowser=${{ env.BROWSER }} \
            -Dheadless=${{ env.HEADLESS }} \
            -Dhuman.pause.enabled=false \
            -Dmaven.test.failure.ignore=true

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 7

      - name: Upload Extent + Surefire Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.ref_name }}
          path: |
            target/extent-reports/
            target/screenshots/
            target/surefire-reports/
            target/downloads/
          retention-days: 7

  # ================================================================
  # STAGE 3 - Allure Report
  # ================================================================
  allure-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/

      - name: Load Previous Allure History
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy Previous History for Trend Graph
        continue-on-error: true
        run: |
          if [ -d "gh-pages/allure-report/history" ]; then
            mkdir -p target/allure-results/history
            cp -r gh-pages/allure-report/history/. target/allure-results/history/
            echo "History copied for trend graph"
          else
            echo "No previous history found - first run"
          fi

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          allure_report: target/allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          destination_dir: allure-report

      - name: Deploy Extent Report to GitHub Pages
        uses: actions/download-artifact@v4
        with:
          name: test-results-${{ github.ref_name }}
          path: target/

      - name: Publish Extent Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/extent-reports
          destination_dir: extent-report