name: GitHub Actions Pipeline - Selenium Automation Framework

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Manual trigger with the same run-time flexibility the Jenkins pipeline
  # already has via its `parameters {}` block — previously this workflow
  # only ever ran the hardcoded defaults below, with no way to ask for a
  # different browser/suite/site without editing the file.
  workflow_dispatch:
    inputs:
      suite_type:
        description: "Suite to run (regression or smoke)"
        type: choice
        options: [ regression, smoke ]
        default: regression
      browser:
        description: "Browser to run against"
        type: choice
        options: [ chrome, firefox, edge ]
        default: chrome
      headless:
        description: "Run headless"
        type: boolean
        default: true
      retry_count:
        description: "Retries for failed tests"
        type: string
        default: "0"
  # Accessibility (axe-core) and visual-regression (AShot screenshot
  # diffing) are opt-in by nature — both slower and more flake-prone than
  # the regular functional suites, and only exist for demoqa — so they
  # don't run on every push/PR like `test` above. Instead they run once a
  # night via the `accessibility-visual-test` job below, which is gated
  # on `github.event_name == 'schedule'` so this same cron entry can't
  # accidentally trigger the regular test matrix too.
  schedule:
    - cron: "0 2 * * *"

# A new push to the same branch/PR cancels whatever run is still in
# progress for that same ref, instead of letting both run to completion —
# the older run's result is about to be superseded anyway. Jenkins gets
# the equivalent via disableConcurrentBuilds(), GitLab CI via
# `interruptible: true` below.
#
# Scheduled (nightly) runs get their own fixed group instead of sharing
# github.ref: a `schedule` trigger's github.ref is the same default-branch
# ref an ordinary push to main uses, so without this, a push to main
# landing while last night's accessibility/visual run is still in progress
# would cancel it outright (cancel-in-progress: true) — losing that run's
# results rather than just superseding an equivalent one, since a push and
# a nightly run aren't actually the same work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

env:
  # Every site that has a <site>-<suite>.xml under testng-suites/ runs as
  # its own matrix job below (see the `test` job's strategy.matrix.site) —
  # previously this workflow only ever tested "demoqa", so "saucedemo" had
  # no CI coverage at all despite the framework fully supporting it (the
  # Jenkins pipeline already covered both via its "Site=ALL" default).
  SUITE_TYPE: ${{ inputs.suite_type || 'regression' }}
  BROWSER: ${{ inputs.browser || 'chrome' }}
  # BUG FIX: `inputs.headless == false` looks like it means "default to
  # headless, unless the manual workflow_dispatch form explicitly turns it
  # off" — but on any non-workflow_dispatch trigger (push, pull_request,
  # schedule) the `inputs` context doesn't exist, so `inputs.headless` is
  # `null`. GitHub Actions expressions coerce mismatched-type comparisons
  # to numbers: `false` -> 0 and `null` -> 0 too, so `null == false`
  # evaluates to TRUE. That collapsed this whole expression to 'false'
  # (non-headless) on every single push/PR/schedule run, not just when
  # someone deliberately disabled headless mode via workflow_dispatch.
  # Chrome then launched with a real, maximized window
  # (--start-maximized) on ubuntu-latest runners that have no display
  # server, crashing immediately with SessionNotCreatedException: "Chrome
  # instance exited" — hitting BaseTest.setUp() on every test class and
  # cascading into the wall of Skipped results TestNG reports whenever a
  # @BeforeMethod fails. Requiring github.event_name == 'workflow_dispatch'
  # as well means a null inputs.headless on any other trigger can no
  # longer accidentally satisfy this condition.
  HEADLESS: ${{ (github.event_name == 'workflow_dispatch' && inputs.headless == false) && 'false' || 'true' }}
  RETRY_COUNT: ${{ inputs.retry_count || '0' }}
  # No MAVEN_OPTS override for maven.repo.local here — every job below uses
  # `cache: 'maven'` on actions/setup-java@v4, which caches Maven's DEFAULT
  # local repo (~/.m2/repository). A previous version of this workflow
  # redirected it to a workspace-relative path via MAVEN_OPTS, which meant
  # that cache was faithfully saving/restoring an always-empty ~/.m2/repository
  # every run while every real dependency landed in the uncached path instead —
  # every job silently re-downloaded its full dependency tree from Maven
  # Central on every run instead of hitting the cache.

jobs:
  # ================================================================
  # STAGE 1 - Build
  # ================================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Project
        run: |
          echo "======= Building Project ======="
          mvn -B clean compile test-compile

  # ================================================================
  # STAGE 2 - Test (one matrix job per site, running in parallel)
  # ================================================================
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [ demoqa, saucedemo ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # WebDriverManager downloads a fresh chromedriver/geckodriver/
      # msedgedriver binary on a cache miss — on an ubuntu-latest runner
      # that cache starts empty every single run (the VM itself isn't
      # reused), so without this every job re-downloads the same driver
      # binary from scratch, which is both slower and adds an avoidable
      # dependency on the driver CDN being reachable/not rate-limiting.
      # Keyed on browser (not site) since the same driver binary is shared
      # across both sites' matrix jobs.
      - name: Cache WebDriverManager binaries
        uses: actions/cache@v4
        with:
          path: ~/.wdm
          key: wdm-${{ runner.os }}-${{ env.BROWSER }}
          restore-keys: |
            wdm-${{ runner.os }}-

      - name: Setup Chrome Browser
        run: |
          echo "======= Setting Up Browser ======="
          if ! command -v google-chrome &> /dev/null; then
            echo "Chrome not found - installing..."
            sudo apt-get update -qq
            # `apt-key` is deprecated and has been removed from the
            # ubuntu-latest (24.04 "noble") runner image, so the old
            # "wget | sudo apt-key add -" line here would fail with
            # "apt-key: command not found" and break this step outright.
            # Use the modern signed-by keyring method instead.
            sudo apt-get install -y -qq gnupg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq google-chrome-stable
          else
            echo "Chrome already installed: $(google-chrome --version)"
          fi

      - name: Run Tests
        run: |
          echo "======= Running Tests: site=${{ matrix.site }} ======="
          mvn -B test \
            -Dsite=${{ matrix.site }} \
            -DsuiteXmlFile=testng-suites/${{ matrix.site }}-${{ env.SUITE_TYPE }}.xml \
            -Dbrowser=${{ env.BROWSER }} \
            -Dheadless=${{ env.HEADLESS }} \
            -Dhuman.pause.enabled=false \
            -Dretry.count=${{ env.RETRY_COUNT }} \
            -Dself-healing.report.path=target/self-healing/${{ matrix.site }}-healing-report.json \
            -Dmaven.test.failure.ignore=true

      # Each matrix job's own runner/filesystem is already isolated from
      # the others, so there's no risk of two sites' results overwriting
      # each other here the way there would be if they ran in the same
      # JVM — unlike the Jenkinsfile's parallel per-site stage, no
      # -Dallure.results.directory override is needed. Results still land
      # in the artifact under a per-site folder purely so the merge step
      # in the allure-report job below can tell them apart.
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.site }}
          path: target/allure-results/
          retention-days: 7

      - name: Upload Extent + Surefire Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # github.ref_name would be "<PR_NUMBER>/merge" on pull_request
          # events — a slash, which upload-artifact rejects outright
          # ("The artifact name is not valid ... Forward slash /"). Every
          # job in a single workflow run shares the same run_id, which is
          # all that's actually needed here (these artifacts only need to
          # be found by the allure-report job further down in this same
          # run) and is guaranteed to never contain a path separator.
          name: test-results-${{ matrix.site }}-${{ github.run_id }}
          path: |
            target/extent-reports/
            target/screenshots/
            target/surefire-reports/
            target/downloads/
            target/self-healing/
          retention-days: 7

  # ================================================================
  # STAGE 2b - Mobile Test (Android emulator + Appium)
  # ================================================================
  # This is a separate job from `test` above rather than a third matrix
  # entry there, because it needs a completely different environment
  # (an Android emulator + Appium server instead of a browser) — trying
  # to squeeze it into the same steps as the browser jobs would either
  # skip the browser setup for nothing or fail immediately trying to
  # install Chrome for a job that will never use it.
  mobile-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # GitHub's ubuntu-latest runners don't have nested virtualization
      # enabled by default, which the Android emulator needs to boot at a
      # usable speed — without this, software-only emulation is
      # impractically slow for CI. This grants the default runner user
      # access to /dev/kvm.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ubuntu-latest already ships Node.js, so this just layers the
      # Appium CLI and the uiautomator2 driver (the one
      # AppiumDriverFactory's Android path talks to) on top of it.
      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      # Start Appium now so it's already listening on 127.0.0.1:4723 (the
      # default AppiumDriverFactory falls back to when appium.server.url
      # isn't overridden) by the time the emulator step below runs tests.
      - name: Start Appium Server
        run: |
          appium --log-timestamp --log-no-colors > appium.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:4723/status > /dev/null; then
              echo "Appium is up"
              break
            fi
            echo "Waiting for Appium... ($i)"
            sleep 2
          done

      - name: Provision mobile.properties from template
        # mobile.properties is deliberately gitignored (see .gitignore —
        # it's meant to hold a real local device serial, not something to
        # commit), so a fresh checkout here never has it. But
        # SiteRegistry.validate("mobile") requires the file to exist on
        # the classpath before ANY mobile test can even start, regardless
        # of the fact that this job overrides every value that actually
        # matters (mobile.device.name, mobile.app.package/activity) via
        # -D flags below. Materialize it from the tracked .example
        # template — same file the header comment already tells a human
        # to copy, just automated for CI where -D flags fill in the real
        # values instead of hand-edited ones.
        run: |
          cp src/test/resources/config/mobile.properties.example \
             src/test/resources/config/mobile.properties

      # Boots an emulator, waits for it to fully come up, runs the given
      # script against it, then tears it down again — all in one step.
      # Targets the built-in Android "Settings" app (see
      # src/main/java/com/automation/mobile/README.md's Quick Start), so
      # no app-under-test APK needs to be built or downloaded first.
      - name: Run Mobile Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # NOTE: this must be a SINGLE line. reactivecircus/android-emulator-runner
          # does not execute a `\`-continued multi-line script as one shell command
          # the way a normal `run:` step does — it runs only the first line and
          # passes the trailing backslash through as a literal argument, which is
          # why `mvn -B test \` alone used to fail with `Unknown lifecycle phase "\"`.
          script: mvn -B test -Dsite=mobile -DsuiteXmlFile=testng-suites/mobile-${{ env.SUITE_TYPE }}.xml -Dmobile.app.package=com.android.settings -Dmobile.app.activity=.Settings -Dmobile.device.name=emulator-5554 -Dretry.count=${{ env.RETRY_COUNT }} -Dself-healing.report.path=target/self-healing/mobile-healing-report.json -Dmaven.test.failure.ignore=true

      # Same artifact-naming convention as the browser `test` job above
      # (allure-results-<job-identifier> / test-results-<job-identifier>-
      # <ref>) so the allure-report job's wildcard download patterns pick
      # these up automatically without needing a separate download step.
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-mobile
          path: target/allure-results/
          retention-days: 7

      - name: Upload Extent + Surefire Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # See the matching comment in the `test` job above — github.ref_name
          # contains a slash on pull_request events, github.run_id doesn't.
          name: test-results-mobile-${{ github.run_id }}
          path: |
            target/extent-reports/
            target/screenshots/
            target/surefire-reports/
            target/self-healing/
            appium.log
          retention-days: 7

  # ================================================================
  # STAGE 2c - Nightly Accessibility + Visual-Regression (demoqa only)
  # ================================================================
  # Both suites only exist for demoqa and are intentionally excluded from
  # the regular suite_type input above — this job is the only place they
  # run, gated on the scheduled trigger so a manual workflow_dispatch or
  # a normal push/PR never picks it up.
  accessibility-visual-test:
    needs: build
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [ accessibility, visual ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Chrome Browser
        run: |
          echo "======= Setting Up Browser ======="
          if ! command -v google-chrome &> /dev/null; then
            echo "Chrome not found - installing..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq gnupg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq google-chrome-stable
          else
            echo "Chrome already installed: $(google-chrome --version)"
          fi

      - name: Run Nightly Suite
        run: |
          echo "======= Running Nightly demoqa ${{ matrix.suite }} Suite ======="
          if [ ! -f "testng-suites/demoqa-${{ matrix.suite }}.xml" ]; then
            echo "testng-suites/demoqa-${{ matrix.suite }}.xml not found - skipping"
            exit 0
          fi
          mvn -B test \
            -Dsite=demoqa \
            -DsuiteXmlFile=testng-suites/demoqa-${{ matrix.suite }}.xml \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Dallure.results.directory=target/allure-results/demoqa-${{ matrix.suite }} \
            -Dself-healing.report.path=target/self-healing/demoqa-${{ matrix.suite }}-healing-report.json \
            -Dmaven.test.failure.ignore=true

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-demoqa-${{ matrix.suite }}
          path: target/allure-results/
          retention-days: 7

      - name: Upload Extent + Surefire Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # See the matching comment in the `test` job above — github.ref_name
          # contains a slash on pull_request events, github.run_id doesn't.
          name: test-results-demoqa-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            target/extent-reports/
            target/screenshots/
            target/surefire-reports/
            target/self-healing/
          retention-days: 7

  # ================================================================
  # STAGE 2d - PR Comment (results summary posted on the pull request)
  # ================================================================
  # Gives a reviewer pass/fail counts and a link to the full reports
  # without leaving the PR — otherwise the only way to see results is
  # clicking into the Actions tab. `always()` so this still comments (with
  # the failure counts) when test/mobile-test failed, rather than only
  # commenting on green runs, which plain `needs:` would enforce.
  # accessibility-visual-test is deliberately NOT in `needs:` here — it
  # only ever runs on the nightly schedule (see its own `if:` above), so
  # on every actual pull_request event it would just be a permanently
  # skipped dependency this job would have to work around for no benefit.
  pr-comment:
    needs: [ test, mobile-test ]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Only needs surefire-reports (for pass/fail counts) — reuses the
      # same test-results-*-<run_id> artifact pattern as the allure-report
      # job, just without also pulling down extent-reports/screenshots
      # this job has no use for.
      - name: Download Surefire Results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*-${{ github.run_id }}
          path: target/
          merge-multiple: true

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/workflows/scripts/post_pr_comment.py

  # ================================================================
  # STAGE 3 - Allure Report (merges every site's results into one report)
  # ================================================================
  allure-report:
    needs: [ test, mobile-test, accessibility-visual-test ]
    # accessibility-visual-test only actually runs on the schedule
    # trigger (see its own `if:` above) — `always()` here means this job
    # still runs on ordinary pushes/PRs even though that one job shows as
    # skipped rather than succeeded, which `needs:` alone would block on.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # merge-multiple: true flattens all matching artifacts (one per
      # site, from the matrix job above) into the SAME target directory —
      # since each site's allure-results file names are UUID-based, they
      # combine into one report covering every site instead of colliding.
      - name: Download Allure Results (all sites)
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: target/allure-results/
          merge-multiple: true

      - name: Load Previous Allure History
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy Previous History for Trend Graph
        continue-on-error: true
        run: |
          if [ -d "gh-pages/allure-report/history" ]; then
            mkdir -p target/allure-results/history
            cp -r gh-pages/allure-report/history/. target/allure-results/history/
            echo "History copied for trend graph"
          else
            echo "No previous history found - first run"
          fi

      # NEITHER released tag of this action currently works — pinned to
      # a specific master commit instead. History, so nobody "fixes"
      # this back to a tag without re-reading it first:
      #
      #   @v1.13 — upstream PR #69 ("Updated docker image and workflows")
      #     moved the Docker base image to amazoncorretto:8 but only
      #     `yum install`s tar/wget/gzip, not findutils. `allure generate`
      #     shells out through `xargs` internally, so the container fails
      #     at runtime with "xargs is not available" and never writes
      #     target/allure-report (the `cp: cannot stat
      #     './target/allure-report/...'` errors are just the downstream
      #     symptom of that, not a second bug).
      #
      #   @v1.12 — predates that image change, so no xargs problem, BUT
      #     its Dockerfile is `FROM openjdk:8-jre-alpine`. Docker Hub
      #     deprecated the whole `openjdk` official-image repo in July
      #     2022, and that specific tag is no longer pullable at all —
      #     `docker build` for this action now fails outright ("Docker
      #     build failed with exit code 1") before the action ever runs.
      #     This isn't a transient registry hiccup; the tag is gone.
      #
      #   master (commit 385367c, unreleased) — already carries the fix
      #     for both: same amazoncorretto:8 base as v1.13, but
      #     `yum install`s findutils too (diff'd entrypoint.sh/action.yml
      #     against v1.13: identical — only the Dockerfile changed).
      #     Pinned to this exact commit SHA (not the `master` branch
      #     name, which is mutable and could move again without notice)
      #     since there's no tagged release with this fix yet. Re-check
      #     upstream for a new tag past v1.13 that includes this same
      #     Dockerfile before switching off the SHA pin.
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@385367cde61ac68c2568a117f7579f7f148dc459
        with:
          allure_results: target/allure-results
          allure_report: target/allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Download Extent Reports (all sites)
        uses: actions/download-artifact@v4
        with:
          # Matches the github.run_id-based names used at upload time in the
          # test/mobile-test/accessibility-visual-test jobs above (see the
          # comments there — github.ref_name contained a slash on
          # pull_request events and made upload-artifact reject the name
          # outright, so nothing ever got uploaded for this pattern to find).
          pattern: test-results-*-${{ github.run_id }}
          path: target/
          merge-multiple: true

      # Aggregates every target/self-healing/<site>-healing-report.json
      # (now included in each test/mobile-test/accessibility-visual-test
      # job's artifact upload — see -Dself-healing.report.path and the
      # matching upload-artifact path list added to those jobs) into one
      # summary, so a healed-but-still-green locator has somewhere visible
      # to surface instead of sitting unread in target/.
      - name: Compute self-healing summary
        id: self_healing
        run: python3 .github/workflows/scripts/compute_self_healing_summary.py

      # Builds the per-test pass/fail trend across recent runs and flags
      # anything flip-flopping. Needs the gh-pages history checked out
      # above (same "Load Previous Allure History" step Allure's own trend
      # graph already relies on) plus this run's surefire XML, downloaded
      # by the step just above.
      - name: Compute flaky test trend
        id: flaky_trend
        run: python3 .github/workflows/scripts/compute_flaky_trend.py

      # Both reports are assembled into one local directory tree and
      # published with a SINGLE peaceiris/actions-gh-pages call below,
      # rather than two separate calls (the previous "Deploy Allure Report"
      # + "Publish Extent Report" steps). Calling that action twice in the
      # same job against the same gh-pages branch is what produced the
      # "fatal: a branch named 'gh-pages' already exists" failure: the
      # second invocation's fresh clone can race the first invocation's
      # push (GitHub's git backend isn't guaranteed to be immediately
      # consistent for a clone that starts moments after a push from the
      # same job), so it sometimes still sees no gh-pages branch, tries to
      # create one via `checkout --orphan`, and collides with local state
      # left behind from its own clone attempt. One push instead of two
      # removes the race entirely, and keep_files: true still preserves
      # whatever already lives on the branch from previous runs.
      - name: Assemble combined GitHub Pages publish directory
        run: |
          mkdir -p target/gh-pages-publish
          if [ -d "target/allure-report" ]; then
            mkdir -p target/gh-pages-publish/allure-report
            cp -r target/allure-report/. target/gh-pages-publish/allure-report/
          else
            echo "::warning::target/allure-report missing — Allure report will not be updated this run"
          fi
          if [ -d "target/extent-reports" ]; then
            mkdir -p target/gh-pages-publish/extent-report
            cp -r target/extent-reports/. target/gh-pages-publish/extent-report/
          else
            echo "::warning::target/extent-reports missing — Extent report will not be updated this run"
          fi

      # Extent's ExtentManager writes one file per site (demoqa-index.html,
      # saucedemo-index.html, mobile-index.html, ...) rather than a single
      # index.html — so extent-report/ on its own has no default page a
      # browser would land on. This generates a root landing page at
      # gh-pages-publish/index.html that links to the Allure report, every
      # Extent report file actually present this run, the self-healing
      # summary, and the flaky-test trend — one bookmarkable URL instead
      # of guessing a path or downloading the artifact zip. Moved from
      # inline bash/printf to a checked-in script once it needed to render
      # tables from the JSON the two steps above produce.
      - name: Generate reports landing page
        run: python3 .github/workflows/scripts/generate_landing_page.py

      - name: Deploy Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/gh-pages-publish
          # Preserves anything already on the branch that isn't under
          # allure-report/ or extent-report/ this run (e.g. if one of the
          # two was skipped above because its source directory was
          # missing).
          keep_files: true

      # Prints clickable report links directly on the workflow run's
      # Summary tab, so viewing the reports never requires downloading
      # the artifact zip. github.event.repository.pages_html_url would be
      # nicer, but download-artifact/checkout jobs don't populate the
      # `repository` webhook payload with Pages info reliably, so the
      # standard <owner>.github.io/<repo>/ URL shape is built manually
      # instead. (If this repo IS the org/user Pages repo, i.e. named
      # exactly "<owner>.github.io", Pages serves it at the domain root
      # with no /<repo>/ segment — the if/else below handles that one case.)
      - name: Publish report links to job summary
        env:
          HEALING_COUNT: ${{ steps.self_healing.outputs.healing_count }}
          FLAKY_COUNT: ${{ steps.flaky_trend.outputs.flaky_count }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            BASE_URL="https://${OWNER}.github.io"
          else
            BASE_URL="https://${OWNER}.github.io/${REPO}"
          fi
          {
            echo "## 📊 Test Reports"
            echo ""
            echo "| Report | Link |"
            echo "|---|---|"
            echo "| All reports (landing page) | [$BASE_URL/]($BASE_URL/) |"
            echo "| Allure | [$BASE_URL/allure-report/]($BASE_URL/allure-report/) |"
            if [ -d "target/gh-pages-publish/extent-report" ]; then
              for f in target/gh-pages-publish/extent-report/*.html; do
                [ -e "$f" ] || continue
                name=$(basename "$f")
                echo "| Extent — $name | [$BASE_URL/extent-report/$name]($BASE_URL/extent-report/$name) |"
              done
            fi
            echo ""
            echo "**Self-healed locators this run:** ${HEALING_COUNT:-0} &middot; **Flaky tests detected:** ${FLAKY_COUNT:-0}"
            echo ""
            echo "_Note: on first-ever deploy, GitHub Pages can take a minute or two to go live, and it must be enabled once under Settings → Pages → Source → Deploy from a branch → \`gh-pages\`._"
          } >> "$GITHUB_STEP_SUMMARY"

      # Self-healing keeps a suite green even while a locator quietly
      # drifts out from under it — fine occasionally, a problem if it's
      # happening every night and nobody's fixing the underlying locator.
      # Only checked on the nightly schedule run (not every push/PR) so a
      # one-off UI hiccup during active development doesn't fail CI; a
      # sustained drift trend failing the nightly build is the point where
      # it's worth someone's attention. Runs after the report is already
      # deployed above, so a threshold breach surfaces as a failed job
      # without blocking the reports themselves from publishing.
      - name: Check self-healing threshold (nightly only)
        if: github.event_name == 'schedule'
        env:
          HEALING_COUNT: ${{ steps.self_healing.outputs.healing_count }}
          # Adjust to taste. Repo/organization Variables (Settings →
          # Secrets and variables → Actions → Variables) can override this
          # per-repo via vars.SELF_HEALING_FAIL_THRESHOLD without editing
          # the workflow file.
          THRESHOLD: ${{ vars.SELF_HEALING_FAIL_THRESHOLD || '5' }}
        run: |
          COUNT="${HEALING_COUNT:-0}"
          echo "Self-healing events: $COUNT (threshold: $THRESHOLD)"
          if [ "$COUNT" -gt "$THRESHOLD" ]; then
            echo "::error::$COUNT locators needed self-healing tonight (threshold: $THRESHOLD). Check the self-healing summary on the landing page and fix the underlying locators."
            exit 1
          fi
