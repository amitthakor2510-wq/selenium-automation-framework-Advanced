name: GitHub Actions Pipeline - Selenium Automation Framework

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Manual trigger with the same run-time flexibility the Jenkins pipeline
  # already has via its `parameters {}` block — previously this workflow
  # only ever ran the hardcoded defaults below, with no way to ask for a
  # different browser/suite/site without editing the file.
  workflow_dispatch:
    inputs:
      suite_type:
        description: "Suite to run (regression or smoke)"
        type: choice
        options: [ regression, smoke ]
        default: regression
      browser:
        description: "Browser to run against"
        type: choice
        options: [ chrome, firefox, edge ]
        default: chrome
      headless:
        description: "Run headless"
        type: boolean
        default: true
      retry_count:
        description: "Retries for failed tests"
        type: string
        default: "0"

# A new push to the same branch/PR cancels whatever run is still in
# progress for that same ref, instead of letting both run to completion —
# the older run's result is about to be superseded anyway. Jenkins gets
# the equivalent via disableConcurrentBuilds(), GitLab CI via
# `interruptible: true` below.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every site that has a <site>-<suite>.xml under testng-suites/ runs as
  # its own matrix job below (see the `test` job's strategy.matrix.site) —
  # previously this workflow only ever tested "demoqa", so "saucedemo" had
  # no CI coverage at all despite the framework fully supporting it (the
  # Jenkins pipeline already covered both via its "Site=ALL" default).
  SUITE_TYPE: ${{ inputs.suite_type || 'regression' }}
  BROWSER: ${{ inputs.browser || 'chrome' }}
  HEADLESS: ${{ inputs.headless == false && 'false' || 'true' }}
  RETRY_COUNT: ${{ inputs.retry_count || '0' }}
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository"

jobs:
  # ================================================================
  # STAGE 1 - Build
  # ================================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Project
        run: |
          echo "======= Building Project ======="
          mvn -B clean compile test-compile

  # ================================================================
  # STAGE 2 - Test (one matrix job per site, running in parallel)
  # ================================================================
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [ demoqa, saucedemo ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # WebDriverManager downloads a fresh chromedriver/geckodriver/
      # msedgedriver binary on a cache miss — on an ubuntu-latest runner
      # that cache starts empty every single run (the VM itself isn't
      # reused), so without this every job re-downloads the same driver
      # binary from scratch, which is both slower and adds an avoidable
      # dependency on the driver CDN being reachable/not rate-limiting.
      # Keyed on browser (not site) since the same driver binary is shared
      # across both sites' matrix jobs.
      - name: Cache WebDriverManager binaries
        uses: actions/cache@v4
        with:
          path: ~/.wdm
          key: wdm-${{ runner.os }}-${{ env.BROWSER }}
          restore-keys: |
            wdm-${{ runner.os }}-

      - name: Setup Chrome Browser
        run: |
          echo "======= Setting Up Browser ======="
          if ! command -v google-chrome &> /dev/null; then
            echo "Chrome not found - installing..."
            sudo apt-get update -qq
            # `apt-key` is deprecated and has been removed from the
            # ubuntu-latest (24.04 "noble") runner image, so the old
            # "wget | sudo apt-key add -" line here would fail with
            # "apt-key: command not found" and break this step outright.
            # Use the modern signed-by keyring method instead.
            sudo apt-get install -y -qq gnupg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq google-chrome-stable
          else
            echo "Chrome already installed: $(google-chrome --version)"
          fi

      - name: Run Tests
        run: |
          echo "======= Running Tests: site=${{ matrix.site }} ======="
          mvn -B test \
            -Dsite=${{ matrix.site }} \
            -DsuiteXmlFile=testng-suites/${{ matrix.site }}-${{ env.SUITE_TYPE }}.xml \
            -Dbrowser=${{ env.BROWSER }} \
            -Dheadless=${{ env.HEADLESS }} \
            -Dhuman.pause.enabled=false \
            -Dretry.count=${{ env.RETRY_COUNT }} \
            -Dmaven.test.failure.ignore=true

      # Each matrix job's own runner/filesystem is already isolated from
      # the others, so there's no risk of two sites' results overwriting
      # each other here the way there would be if they ran in the same
      # JVM — unlike the Jenkinsfile's parallel per-site stage, no
      # -Dallure.results.directory override is needed. Results still land
      # in the artifact under a per-site folder purely so the merge step
      # in the allure-report job below can tell them apart.
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.site }}
          path: target/allure-results/
          retention-days: 7

      - name: Upload Extent + Surefire Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.site }}-${{ github.ref_name }}
          path: |
            target/extent-reports/
            target/screenshots/
            target/surefire-reports/
            target/downloads/
          retention-days: 7

  # ================================================================
  # STAGE 3 - Allure Report (merges every site's results into one report)
  # ================================================================
  allure-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # merge-multiple: true flattens all matching artifacts (one per
      # site, from the matrix job above) into the SAME target directory —
      # since each site's allure-results file names are UUID-based, they
      # combine into one report covering every site instead of colliding.
      - name: Download Allure Results (all sites)
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: target/allure-results/
          merge-multiple: true

      - name: Load Previous Allure History
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy Previous History for Trend Graph
        continue-on-error: true
        run: |
          if [ -d "gh-pages/allure-report/history" ]; then
            mkdir -p target/allure-results/history
            cp -r gh-pages/allure-report/history/. target/allure-results/history/
            echo "History copied for trend graph"
          else
            echo "No previous history found - first run"
          fi

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          allure_report: target/allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          destination_dir: allure-report

      - name: Download Extent Reports (all sites)
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*-${{ github.ref_name }}
          path: target/
          merge-multiple: true

      - name: Publish Extent Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/extent-reports
          destination_dir: extent-report
