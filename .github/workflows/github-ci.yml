name: GitHub Actions Pipeline - Selenium Automation Framework

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Manual trigger with the same run-time flexibility the Jenkins pipeline
  # already has via its `parameters {}` block — previously this workflow
  # only ever ran the hardcoded defaults below, with no way to ask for a
  # different browser/suite/site without editing the file.
  workflow_dispatch:
    inputs:
      suite_type:
        description: "Suite to run (regression or smoke)"
        type: choice
        options: [ regression, smoke ]
        default: regression
      browser:
        description: "Browser to run against"
        type: choice
        options: [ chrome, firefox, edge ]
        default: chrome
      headless:
        description: "Run headless"
        type: boolean
        default: true
      retry_count:
        description: "Retries for failed tests"
        type: string
        default: "0"
      run_safari:
        description: "Also run Safari (needs a macos-latest runner minute budget — runs automatically on every push, this only controls manual dispatch runs)"
        type: boolean
        default: false
      record_video:
        description: "Record a video per web test (implies non-headless + xvfb; off by default — CPU/disk cost, and pointless when headless since there's nothing on-screen to capture)"
        type: boolean
        default: false
  # Accessibility (axe-core) and visual-regression (AShot screenshot
  # diffing) are opt-in by nature — both slower and more flake-prone than
  # the regular functional suites, and only exist for demoqa — so they
  # don't run on every push/PR like `test` above. Instead they run once a
  # night via the `accessibility-visual-test` job below, which is gated
  # on `github.event_name == 'schedule'` so this same cron entry can't
  # accidentally trigger the regular test matrix too.
  schedule:
    - cron: "0 2 * * *"

# A new push to the same branch/PR cancels whatever run is still in
# progress for that same ref, instead of letting both run to completion —
# the older run's result is about to be superseded anyway. Jenkins gets
# the equivalent via disableConcurrentBuilds(), GitLab CI via
# `interruptible: true` below.
#
# Scheduled (nightly) runs get their own fixed group instead of sharing
# github.ref: a `schedule` trigger's github.ref is the same default-branch
# ref an ordinary push to main uses, so without this, a push to main
# landing while last night's accessibility/visual run is still in progress
# would cancel it outright (cancel-in-progress: true) — losing that run's
# results rather than just superseding an equivalent one, since a push and
# a nightly run aren't actually the same work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

env:
  # Every site that has a <site>-<suite>.xml under testng-suites/ runs as
  # its own matrix job below (see the `test` job's strategy.matrix.site) —
  # previously this workflow only ever tested "demoqa", so "saucedemo" had
  # no CI coverage at all despite the framework fully supporting it (the
  # Jenkins pipeline already covered both via its "Site=ALL" default).
  SUITE_TYPE: ${{ inputs.suite_type || 'regression' }}
  BROWSER: ${{ inputs.browser || 'chrome' }}
  # BUG FIX: `inputs.headless == false` looks like it means "default to
  # headless, unless the manual workflow_dispatch form explicitly turns it
  # off" — but on any non-workflow_dispatch trigger (push, pull_request,
  # schedule) the `inputs` context doesn't exist, so `inputs.headless` is
  # `null`. GitHub Actions expressions coerce mismatched-type comparisons
  # to numbers: `false` -> 0 and `null` -> 0 too, so `null == false`
  # evaluates to TRUE. That collapsed this whole expression to 'false'
  # (non-headless) on every single push/PR/schedule run, not just when
  # someone deliberately disabled headless mode via workflow_dispatch.
  # Chrome then launched with a real, maximized window
  # (--start-maximized) on ubuntu-latest runners that have no display
  # server, crashing immediately with SessionNotCreatedException: "Chrome
  # instance exited" — hitting BaseTest.setUp() on every test class and
  # cascading into the wall of Skipped results TestNG reports whenever a
  # @BeforeMethod fails. Requiring github.event_name == 'workflow_dispatch'
  # as well means a null inputs.headless on any other trigger can no
  # longer accidentally satisfy this condition.
  # RECORD_VIDEO forces headless off — a headless browser renders to no
  # display at all, so there's nothing for VideoRecorder's screen-grab to
  # capture; recording only makes sense against a real (or Xvfb virtual)
  # display. This deliberately overrides the HEADLESS input rather than
  # requiring the person to also flip headless off by hand.
  RECORD_VIDEO: ${{ (github.event_name == 'workflow_dispatch' && inputs.record_video == true) && 'true' || 'false' }}
  HEADLESS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.record_video == true)) && 'false' || ((github.event_name == 'workflow_dispatch' && inputs.headless == false) && 'false' || 'true') }}
  RETRY_COUNT: ${{ inputs.retry_count || '0' }}
  # ReportPortal — see pom.xml's <reportportal.*> properties and
  # reportportal.properties for how these actually reach the test JVM.
  # Auto-detected from whether the RP_API_KEY repo secret is configured at
  # all, rather than a hardcoded true/false: a fork or a contributor's PR
  # branch never has access to this repo's secrets (GitHub redacts them to
  # empty string on those runs), so this evaluates to 'false' there
  # automatically — no separate "is this a fork" check needed, and no risk
  # of a fork's run failing trying to reach a ReportPortal server it has no
  # credentials for. Endpoint/project are treated as secrets too (not
  # `vars`) purely so a self-hosted RP server's URL isn't exposed in a
  # public repo's logs; neither is actually sensitive the way the API key
  # is.
  # Requires RP_ENDPOINT to also be set, not just RP_API_KEY — an API key
  # alone with no endpoint previously fell back to the ReportPortal client's
  # own default (localhost:8888), which a GitHub-hosted runner can never
  # reach, silently failing every job. See RP_PROJECT too if you also want
  # to require that before enabling.
  REPORTPORTAL_ENABLE: ${{ secrets.RP_API_KEY != '' && secrets.RP_ENDPOINT != '' && 'true' || 'false' }}
  # No MAVEN_OPTS override for maven.repo.local here — every job below uses
  # `cache: 'maven'` on actions/setup-java@v5, which caches Maven's DEFAULT
  # local repo (~/.m2/repository). A previous version of this workflow
  # redirected it to a workspace-relative path via MAVEN_OPTS, which meant
  # that cache was faithfully saving/restoring an always-empty ~/.m2/repository
  # every run while every real dependency landed in the uncached path instead —
  # every job silently re-downloaded its full dependency tree from Maven
  # Central on every run instead of hitting the cache.

jobs:
  # ================================================================
  # STAGE 1 - Build
  # ================================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Project
        run: |
          echo "======= Building Project ======="
          mvn -B clean compile test-compile

  # ================================================================
  # STAGE 1b - Code Quality (Checkstyle)
  # ================================================================
  # Runs in parallel with `test`/`mobile-test` rather than gating them —
  # a style violation shouldn't block seeing whether the suite itself
  # still passes, and Checkstyle doesn't need a browser or compiled test
  # classes to do its job, just the .java source tree, so there's nothing
  # for it to wait on besides `build` finishing the initial compile.
  # `checkstyle:check@checkstyle-check` invokes that one named execution
  # directly (see pom.xml) instead of running the full `mvn verify`
  # lifecycle, which would otherwise re-run the entire test suite a
  # second time just to reach the verify phase.
  checkstyle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Checkstyle
        run: |
          echo "======= Running Checkstyle (checkstyle.xml) ======="
          mvn -B checkstyle:check@checkstyle-check

  # ================================================================
  # STAGE 1c - Test Impact Analysis (informational, PRs only)
  # ================================================================
  # Deliberately does NOT replace or gate the full `test`/`mobile-test`
  # matrix below — those stay the real safety net every push/PR still runs
  # in full. This job answers a narrower, faster question up front: "of
  # everything in this PR, which test classes does
  # com.automation.core.tia.TestImpactAnalyzer think are actually affected,
  # and by how much could a filtered run have saved". Posted to the job
  # summary and uploaded as an artifact so a reviewer/author can see it
  # without waiting on the full matrix, and a team that later wants to
  # actually gate on this can swap `Scripts/test-impact-analysis.sh --run`
  # into (or alongside) the `test` job's own steps — see
  # TEST_IMPACT_ANALYSIS.md for that migration path.
  test-impact-analysis:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full history (not the default shallow clone) — TIA diffs against
          # the PR's base branch, which a shallow checkout wouldn't have.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile (main + test sources)
        run: mvn -B -q compile test-compile

      - name: Run Test Impact Analysis
        run: |
          echo "======= Test Impact Analysis: origin/${{ github.base_ref }}...HEAD ======="
          git fetch origin "${{ github.base_ref }}" --depth=1
          mvn -B -q exec:java@tia -Ptia \
            -Dtia.base="origin/${{ github.base_ref }}" \
            -Dtia.head="${{ github.event.pull_request.head.sha }}"
          cat target/tia/impact-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TIA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-impact-analysis
          path: target/tia/
          retention-days: 14

  # ================================================================
  # STAGE 1d - Coverage map (nightly / manual only — not on every PR)
  # ================================================================
  # Refreshes target/tia/coverage-map.txt: for each site, runs that site's
  # regression suite SERIALLY with JaCoCo's JMX agent enabled
  # (Scripts/build-coverage-map.sh — see that script and
  # JacocoPerTestCoverageListener's javadoc for why serial execution is
  # required for this to produce trustworthy data, and why that makes it
  # unsuitable to run on every PR the way test-impact-analysis above is).
  # TestImpactAnalyzer picks this file up automatically if present (see
  # CoverageMap) — it only ever WIDENS the impacted-tests set versus the
  # bytecode graph alone, catching reflection/dynamic-dispatch dependencies
  # the graph can't see, so a map that's up to a day stale is still safe to
  # use; see CoverageMap's own javadoc on why. TEST_IMPACT_ANALYSIS.md →
  # "Coverage-based fallback" has the full design.
  coverage-map:
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [demoqa, saucedemo]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build coverage map for ${{ matrix.site }}
        env:
          HEADLESS: 'true'
        # BUG FIX (2026-08-17): invoking this as `./Scripts/build-coverage-map.sh`
        # failed both site legs with "Permission denied" (exit 126) — the
        # script's executable bit isn't set in the checked-out tree (a very
        # common casualty of zip/unzip or some git checkout/clone
        # configurations, which don't always preserve file mode bits).
        # `bash Scripts/...` runs the file's contents directly regardless of
        # its executable bit, so this doesn't depend on that bit being set
        # correctly in whatever tree checks this out.
        run: bash Scripts/build-coverage-map.sh "${{ matrix.site }}"

      - name: Upload per-site coverage map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-map-${{ matrix.site }}
          path: |
            target/tia/coverage-map.txt
            target/jacoco-per-test/UNRELIABLE.marker
          if-no-files-found: ignore
          retention-days: 30

  # ================================================================
  # STAGE 1.5 - Compute the test matrix as real JSON data
  # ================================================================
  # BUG FIX (2026-08-17): `test` below used to cross-join a static
  # `site: [demoqa, saucedemo]` with a *dynamically-computed*
  # `browser: ${{ fromJSON(...) }}` list, then layer `os` on top via
  # `include:` entries that only specified `browser` + `os` (no `site`).
  # That pattern merged fine for chrome/firefox/edge (site names showed
  # up correctly, e.g. "test (demoqa, chrome)") but safari specifically
  # came back as a single stray job with `site` completely unset —
  # `mvn test -Dsite= -DsuiteXmlFile=testng-suites/-safari-regression.xml`
  # failed immediately with "Suite file .../-safari-regression.xml is not
  # a valid file". GitHub's include-matching rules for a dynamically
  # generated matrix key evidently don't behave symmetrically across
  # every value in that key's list. Rather than chase GitHub's exact
  # internal quirk, this job builds the complete, unambiguous list of
  # {site, browser, os} objects as plain JSON up front — no
  # cross-product, no partial-key include matching, nothing left for
  # GitHub to mis-merge. `test` below just consumes it via
  # `fromJSON(needs.matrix-setup.outputs.matrix)`.
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build test matrix JSON
        id: build
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BROWSER: ${{ inputs.browser }}
          RUN_SAFARI: ${{ inputs.run_safari }}
        # Every line of the embedded python script below is indented to
        # match this step's own YAML block-scalar base indentation
        # (10 spaces) — a zero-indented python block nested in here
        # previously broke the YAML parser itself (lines starting at
        # column 0 read as less-indented than the block's own base
        # indentation, which silently ends the `run: |` block scalar
        # early and corrupts the rest of the workflow file). Python
        # itself doesn't care about this uniform extra indentation — it
        # only tracks indentation *changes* between lines, and every
        # line here shares the same 10-space base, so the if/elif/else
        # body's one extra indent level below is still the only
        # indentation Python actually sees.
        run: |
          python3 -c "
          import json, os
          sites = ['demoqa', 'saucedemo']
          event = os.environ.get('EVENT_NAME', '')
          dispatch_browser = os.environ.get('DISPATCH_BROWSER', '') or 'chrome'
          run_safari = os.environ.get('RUN_SAFARI', '') == 'true'
          if event == 'workflow_dispatch':
              browsers = [dispatch_browser] + (['safari'] if run_safari else [])
          elif event == 'push':
              browsers = ['chrome', 'firefox', 'edge', 'safari']
          else:
              browsers = ['chrome', 'firefox', 'edge']
          os_for_browser = {'safari': 'macos-latest'}
          combos = [{'site': s, 'browser': b, 'os': os_for_browser.get(b, 'ubuntu-latest')} for s in sites for b in browsers]
          print('matrix=' + json.dumps({'include': combos}))
          " >> "$GITHUB_OUTPUT"

  # ================================================================
  # STAGE 2 - Test (one matrix job per site x browser, running in
  # parallel — including Safari, see matrix.os below)
  # ================================================================
  test:
    needs: [ build, matrix-setup ]
    # runs-on is now driven by matrix.os instead of being hardcoded to
    # ubuntu-latest. Safari has no Linux build at all (safaridriver ships
    # inside macOS itself) — it used to be its own separate `test-safari`
    # job/workflow-run entry purely because of that runner difference, even
    # though it's conceptually just a fourth browser leg of the same site
    # matrix. GitHub Actions lets `runs-on` reference matrix context, so
    # folding safari's `os: macos-latest` into the same `include` list
    # below puts it back under the single "test" job umbrella (shows as
    # "test (demoqa, safari)" / "test (saucedemo, safari)" next to the
    # other browsers) instead of a separately-named job in the run graph.
    runs-on: ${{ matrix.os }}
    # RP_API_KEY as a job-level env var (not a -D flag on the `mvn test`
    # command line below) so it's just an ordinary OS environment variable
    # the forked surefire JVM inherits like any child process — never
    # visible in a command line, process listing, or build log the way a
    # -Drp.api.key=... would be. See reportportal.properties' comment on
    # why this is the only ReportPortal setting handled this way. Empty
    # string (not unset) on a fork/external-PR run, same as
    # REPORTPORTAL_ENABLE above — the agent no-ops either way since
    # reportportal.enable resolves to 'false' on those runs regardless.
    env:
      RP_API_KEY: ${{ secrets.RP_API_KEY }}
    strategy:
      fail-fast: false
      # Multi-browser matrix — was previously a single hardcoded ${{
      # env.BROWSER }} (chrome unless overridden via workflow_dispatch),
      # so a firefox/edge-specific regression (a locator that only
      # resolves differently under Marionette or Chromium-Edge's CDP
      # implementation) had no way to surface on a normal push/PR; someone
      # had to remember to manually dispatch with browser=firefox first.
      # The full {site, browser, os} combination list is computed as real
      # JSON by matrix-setup above (see that job's comment for why) and
      # consumed here as-is — every entry is already a fully-specified
      # triple, so there's no cross-product or include-merging left for
      # GitHub to get ambiguous about.
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # WebDriverManager downloads a fresh chromedriver/geckodriver/
      # msedgedriver binary on a cache miss — on an ubuntu-latest runner
      # that cache starts empty every single run (the VM itself isn't
      # reused), so without this every job re-downloads the same driver
      # binary from scratch, which is both slower and adds an avoidable
      # dependency on the driver CDN being reachable/not rate-limiting.
      # Keyed on browser (not site) since the same driver binary is shared
      # across both sites' matrix jobs. Safari ships its own driver inside
      # macOS (no WebDriverManager download), so this cache is simply
      # unused (and harmless) on that leg.
      - name: Cache WebDriverManager binaries
        uses: actions/cache@v4
        with:
          path: ~/.wdm
          key: wdm-${{ runner.os }}-${{ matrix.browser }}
          restore-keys: |
            wdm-${{ runner.os }}-

      # Split into one step per browser (each gated on matrix.browser)
      # rather than one script with an if/elif, so a failed edge install
      # doesn't get buried in a step whose name still says "Setup Chrome
      # Browser" in the Actions UI — each leg's log is under its own
      # clearly-named step regardless of which one actually ran.
      - name: Setup Chrome Browser
        if: matrix.browser == 'chrome'
        run: |
          echo "======= Setting Up Chrome ======="
          if ! command -v google-chrome &> /dev/null; then
            echo "Chrome not found - installing..."
            sudo apt-get update -qq
            # `apt-key` is deprecated and has been removed from the
            # ubuntu-latest (24.04 "noble") runner image, so the old
            # "wget | sudo apt-key add -" line here would fail with
            # "apt-key: command not found" and break this step outright.
            # Use the modern signed-by keyring method instead.
            sudo apt-get install -y -qq gnupg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq google-chrome-stable
          else
            echo "Chrome already installed: $(google-chrome --version)"
          fi

      # ubuntu-latest ships Firefox as a pre-installed snap, which
      # GeckoDriver can drive directly — no separate install step needed,
      # this is just a visibility check so a missing/broken snap fails
      # fast with a clear message instead of surfacing later as an opaque
      # SessionNotCreatedException from deep inside WebDriverManager.
      - name: Verify Firefox Browser
        if: matrix.browser == 'firefox'
        run: |
          echo "======= Verifying Firefox ======="
          command -v firefox && firefox --version || { echo "::error::Firefox not found on runner image"; exit 1; }

      - name: Setup Edge Browser
        if: matrix.browser == 'edge'
        run: |
          echo "======= Setting Up Edge ======="
          if ! command -v microsoft-edge-stable &> /dev/null; then
            echo "Edge not found - installing..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq gnupg
            wget -q -O - https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-edge-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge-keyring.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq microsoft-edge-stable
          else
            echo "Edge already installed: $(microsoft-edge-stable --version)"
          fi

      # macos-latest runners ship Safari but Remote Automation is off by
      # default — without this every session fails immediately with
      # "Could not create a session" from Selenium itself, same failure
      # mode documented on DriverFactory.createSafariDriver(). BUG FIX:
      # `safaridriver --enable` without sudo prompts an interactive
      # "Password:" on current macos-latest images (enabling it modifies
      # a system-level launchd/TCC setting, not a per-user one) — with no
      # TTY attached in Actions that prompt just hangs the step until it's
      # killed, surfacing as "Error: Process completed with exit code 1."
      # The runner user has passwordless sudo configured, so running the
      # same command under sudo lets it complete non-interactively instead
      # of ever hitting that prompt.
      - name: Enable Safari WebDriver
        if: matrix.browser == 'safari'
        run: sudo safaridriver --enable

      # xvfb-run gives VideoRecorder (java.awt.Robot) a real virtual display
      # to capture — headless Chrome/Firefox/Edge render to nothing at all,
      # so RECORD_VIDEO forces HEADLESS=false above and needs an actual (or
      # virtual) display to run non-headless on a display-less runner.
      # ubuntu-latest only — safari's macos-latest runner has a real
      # display already and has no headless mode to begin with.
      - name: Install Xvfb for video recording
        if: env.RECORD_VIDEO == 'true' && matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      # CaptchaSolver (Tess4J) needs the native tesseract-ocr binary + trained
      # data on the runner — this job runs mvn directly on the runner image,
      # not through this repo's Dockerfile, so without this step every
      # SOLVE_TEXT_CAPTCHA/SOLVE_MATH_CAPTCHA keyword AND every BasePage/
      # KeywordEngine auto-detect pass fails fast with "Could not locate a
      # tessdata directory" (ConfigException) the first time a page has one.
      - name: Setup Tesseract OCR (CaptchaSolver)
        run: |
          echo "======= Setting Up Tesseract OCR ======="
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            command -v tesseract &> /dev/null || brew install tesseract
          else
            if ! command -v tesseract &> /dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
            fi
          fi
          tesseract --version 2>&1 | head -1

      - name: Run Tests
        run: |
          echo "======= Running Tests: site=${{ matrix.site }} browser=${{ matrix.browser }} ======="
          MVN_RUNNER=""
          if [ "${{ env.RECORD_VIDEO }}" = "true" ] && [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            MVN_RUNNER="xvfb-run -a"
          fi
          if [ "${{ matrix.browser }}" = "safari" ]; then
            # Uses the dedicated *-safari-<suite>.xml suite files
            # (parallel="none") instead of the plain ones the other three
            # browsers use: Safari allows only one WebDriver session on a
            # machine at a time (see DriverFactory.createSafariDriver()'s
            # javadoc), so a thread-count>1 suite would fail outright under
            # Safari. No -Dheadless is passed — Safari has no headless
            # mode, and DriverFactory already warns and continues if one
            # reaches it anyway. -Dallure.results.directory keeps this
            # leg's results in their own subfolder for the same reason the
            # old dedicated job did: merge-multiple in the allure-report
            # job's download step needs every leg's folder name to differ.
            $MVN_RUNNER mvn -B test \
              -Dsite=${{ matrix.site }} \
              -DsuiteXmlFile=testng-suites/${{ matrix.site }}-safari-${{ env.SUITE_TYPE }}.xml \
              -Dbrowser=safari \
              -Dhuman.pause.enabled=false \
              -Dretry.count=${{ env.RETRY_COUNT }} \
              -Dallure.results.directory=target/allure-results/${{ matrix.site }}-safari \
              -Dself-healing.report.path=target/self-healing/${{ matrix.site }}-safari-healing-report.json \
              -Dreportportal.enable=${{ env.REPORTPORTAL_ENABLE }} \
              -Dreportportal.endpoint=${{ secrets.RP_ENDPOINT }} \
              -Dreportportal.project=${{ secrets.RP_PROJECT }} \
              -Dreportportal.attributes="site:${{ matrix.site }};browser:safari;suite:${{ env.SUITE_TYPE }};ci:github-actions;run:${{ github.run_id }}" \
              -Dmaven.test.failure.ignore=true
          else
            $MVN_RUNNER mvn -B test \
              -Dsite=${{ matrix.site }} \
              -DsuiteXmlFile=testng-suites/${{ matrix.site }}-${{ env.SUITE_TYPE }}.xml \
              -Dbrowser=${{ matrix.browser }} \
              -Dheadless=${{ env.HEADLESS }} \
              -Dvideo.enabled=${{ env.RECORD_VIDEO }} \
              -Dhuman.pause.enabled=false \
              -Dretry.count=${{ env.RETRY_COUNT }} \
              -Dself-healing.report.path=target/self-healing/${{ matrix.site }}-healing-report.json \
              -Dreportportal.enable=${{ env.REPORTPORTAL_ENABLE }} \
              -Dreportportal.endpoint=${{ secrets.RP_ENDPOINT }} \
              -Dreportportal.project=${{ secrets.RP_PROJECT }} \
              -Dreportportal.attributes="site:${{ matrix.site }};browser:${{ matrix.browser }};suite:${{ env.SUITE_TYPE }};ci:github-actions;run:${{ github.run_id }}" \
              -Dmaven.test.failure.ignore=true
          fi

      # Each matrix job's own runner/filesystem is already isolated from
      # the others, so there's no risk of two sites' results overwriting
      # each other here the way there would be if they ran in the same
      # JVM — unlike the Jenkinsfile's parallel per-site stage, no
      # -Dallure.results.directory override is needed outside the safari
      # leg above. Results still land in the artifact under a per-site
      # folder purely so the merge step in the allure-report job below can
      # tell them apart.
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.site }}-${{ matrix.browser }}
          path: target/allure-results/
          retention-days: 7

      - name: Upload Extent + Surefire Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # github.ref_name would be "<PR_NUMBER>/merge" on pull_request
          # events — a slash, which upload-artifact rejects outright
          # ("The artifact name is not valid ... Forward slash /"). Every
          # job in a single workflow run shares the same run_id, which is
          # all that's actually needed here (these artifacts only need to
          # be found by the allure-report job further down in this same
          # run) and is guaranteed to never contain a path separator.
          name: test-results-${{ matrix.site }}-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            target/extent-reports/
            target/logs/
            target/screenshots/
            target/surefire-reports/
            target/downloads/
            target/videos/
            target/self-healing/
          retention-days: 7

      # Feeds the coverage-gate job below. Only uploaded from the
      # matrix.browser == 'chrome' leg once the browser matrix is enabled —
      # the same core/ classes get exercised regardless of which browser
      # ran them, so merging one exec file per site (not one per
      # site-browser combination) is enough to represent "did core/ get
      # covered this run" without inflating the merge step for no benefit.
      - name: Upload JaCoCo exec (chrome leg only)
        if: always() && matrix.browser == 'chrome'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-${{ matrix.site }}
          path: target/jacoco.exec
          retention-days: 7
          if-no-files-found: warn

  # ================================================================
  # STAGE 2b - Mobile Test (Android emulator + Appium)
  # ================================================================
  # This is a separate job from `test` above rather than a third matrix
  # entry there, because it needs a completely different environment
  # (an Android emulator + Appium server instead of a browser) — trying
  # to squeeze it into the same steps as the browser jobs would either
  # skip the browser setup for nothing or fail immediately trying to
  # install Chrome for a job that will never use it.
  mobile-test:
    needs: build
    runs-on: ubuntu-latest
    # See the `test` job's identical env block above for why RP_API_KEY is
    # a job-level env var rather than a -D flag.
    env:
      RP_API_KEY: ${{ secrets.RP_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # GitHub's ubuntu-latest runners don't have nested virtualization
      # enabled by default, which the Android emulator needs to boot at a
      # usable speed — without this, software-only emulation is
      # impractically slow for CI. This grants the default runner user
      # access to /dev/kvm.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ubuntu-latest already ships Node.js, so this just layers the
      # Appium CLI and the uiautomator2 driver (the one
      # AppiumDriverFactory's Android path talks to) on top of it.
      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      # Start Appium now so it's already listening on 127.0.0.1:4723 (the
      # default AppiumDriverFactory falls back to when appium.server.url
      # isn't overridden) by the time the emulator step below runs tests.
      - name: Start Appium Server
        run: |
          appium --log-timestamp --log-no-colors > appium.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:4723/status > /dev/null; then
              echo "Appium is up"
              break
            fi
            echo "Waiting for Appium... ($i)"
            sleep 2
          done

      - name: Provision mobile.properties from template
        # mobile.properties is deliberately gitignored (see .gitignore —
        # it's meant to hold a real local device serial, not something to
        # commit), so a fresh checkout here never has it. But
        # SiteRegistry.validate("mobile") requires the file to exist on
        # the classpath before ANY mobile test can even start, regardless
        # of the fact that this job overrides every value that actually
        # matters (mobile.device.name, mobile.app.package/activity) via
        # -D flags below. Materialize it from the tracked .example
        # template — same file the header comment already tells a human
        # to copy, just automated for CI where -D flags fill in the real
        # values instead of hand-edited ones.
        run: |
          cp src/test/resources/config/mobile.properties.example \
             src/test/resources/config/mobile.properties

      # Boots an emulator, waits for it to fully come up, runs the given
      # script against it, then tears it down again — all in one step.
      # Targets the built-in Android "Settings" app (see
      # src/main/java/com/automation/mobile/README.md's Quick Start), so
      # no app-under-test APK needs to be built or downloaded first.
      - name: Run Mobile Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # NOTE: this must be a SINGLE line. reactivecircus/android-emulator-runner
          # does not execute a `\`-continued multi-line script as one shell command
          # the way a normal `run:` step does — it runs only the first line and
          # passes the trailing backslash through as a literal argument, which is
          # why `mvn -B test \` alone used to fail with `Unknown lifecycle phase "\"`.
          script: mvn -B test -Dsite=mobile -DsuiteXmlFile=testng-suites/mobile-${{ env.SUITE_TYPE }}.xml -Dmobile.app.package=com.android.settings -Dmobile.app.activity=.Settings -Dmobile.device.name=emulator-5554 -Dretry.count=${{ env.RETRY_COUNT }} -Dself-healing.report.path=target/self-healing/mobile-healing-report.json -Dreportportal.enable=${{ env.REPORTPORTAL_ENABLE }} -Dreportportal.endpoint=${{ secrets.RP_ENDPOINT }} -Dreportportal.project=${{ secrets.RP_PROJECT }} -Dreportportal.attributes="site:mobile;platform:android;suite:${{ env.SUITE_TYPE }};ci:github-actions;run:${{ github.run_id }}" -Dmaven.test.failure.ignore=true

      # Same artifact-naming convention as the browser `test` job above
      # (allure-results-<job-identifier> / test-results-<job-identifier>-
      # <ref>) so the allure-report job's wildcard download patterns pick
      # these up automatically without needing a separate download step.
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-mobile
          path: target/allure-results/
          retention-days: 7

      - name: Upload Extent + Surefire Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # See the matching comment in the `test` job above — github.ref_name
          # contains a slash on pull_request events, github.run_id doesn't.
          name: test-results-mobile-${{ github.run_id }}
          path: |
            target/extent-reports/
            target/logs/
            target/screenshots/
            target/surefire-reports/
            target/self-healing/
            appium.log
          retention-days: 7

      # See the matching step in the `test` job above — feeds the
      # coverage-gate job's merge step so the mobile driver-factory /
      # BaseMobilePage slice of core/ counts toward the coverage gate too,
      # not just whatever the two browser suites happen to touch.
      - name: Upload JaCoCo exec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-mobile
          path: target/jacoco.exec
          retention-days: 7
          if-no-files-found: warn

  # ================================================================
  # STAGE 2c - Coverage Gate (merged JaCoCo check across every job)
  # ================================================================
  # Each test/mobile-test job above only exercises the slice of core/ its
  # own suite touches — checking any single job's target/jacoco.exec
  # against the 50% core/ threshold in pom.xml would fail unfairly
  # whenever, say, the saucedemo job alone doesn't happen to touch
  # AccessibilityUtils. This downloads every job's jacoco-exec-* artifact,
  # merges them into one target/jacoco.exec via jacoco:merge@jacoco-merge,
  # then runs the report + the real gate against that union.
  # accessibility-visual-test is deliberately excluded from `needs:` for
  # the same reason it's excluded from pr-comment above — it's nightly-only
  # and would otherwise be a permanently-skipped dependency on every
  # ordinary push/PR run.
  coverage-gate:
    needs: [ test, mobile-test ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Only compiles main sources (no tests) — this job never runs the
      # suite itself, it just needs target/classes present for jacoco:report
      # to map the merged exec data back to source lines.
      - name: Compile main sources
        run: mvn -B compile

      - name: Download JaCoCo exec files (all jobs)
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-exec-*
          path: target/jacoco-raw
          merge-multiple: false

      - name: Merge coverage data
        id: merge
        run: |
          echo "======= Downloaded exec files ======="
          find target/jacoco-raw -name '*.exec' -print
          if ! find target/jacoco-raw -name '*.exec' -print -quit | grep -q .; then
            echo "::warning::No jacoco.exec files found from any job — skipping coverage gate for this run."
            echo "have_data=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "have_data=true" >> "$GITHUB_OUTPUT"
          mvn -B jacoco:merge@jacoco-merge

      - name: Generate merged coverage report
        if: steps.merge.outputs.have_data == 'true'
        run: mvn -B jacoco:report@jacoco-report

      - name: Upload merged coverage report
        if: steps.merge.outputs.have_data == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-merged-report
          path: target/site/jacoco/
          retention-days: 14

      # This is the real gate: fails the job (and therefore the workflow
      # run) if com.automation.core.* line coverage across the merged data
      # is under 50% — see the jacoco-check execution/comment in pom.xml.
      - name: Enforce coverage threshold (core/ >= 50% lines)
        if: steps.merge.outputs.have_data == 'true'
        run: mvn -B jacoco:check@jacoco-check

      - name: Publish coverage summary
        if: always() && steps.merge.outputs.have_data == 'true'
        run: |
          {
            echo "## 📊 Coverage Gate (com.automation.core.*)"
            echo ""
            echo "Merged JaCoCo report: see the \`jacoco-merged-report\` artifact on this run, or \`target/site/jacoco/index.html\` if downloaded locally."
            echo "Threshold: 50% line coverage on \`com.automation.core.*\`, enforced by \`jacoco:check@jacoco-check\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ================================================================
  # STAGE 2e - Nightly Accessibility + Visual-Regression (demoqa only)
  # ================================================================
  # Both suites only exist for demoqa and are intentionally excluded from
  # the regular suite_type input above — this job is the only place they
  # run, gated on the scheduled trigger so a manual workflow_dispatch or
  # a normal push/PR never picks it up.
  accessibility-visual-test:
    needs: build
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # See the `test` job's identical env block above for why RP_API_KEY is
    # a job-level env var rather than a -D flag.
    env:
      RP_API_KEY: ${{ secrets.RP_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        suite: [ accessibility, visual ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Chrome Browser
        run: |
          echo "======= Setting Up Browser ======="
          if ! command -v google-chrome &> /dev/null; then
            echo "Chrome not found - installing..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq gnupg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq google-chrome-stable
          else
            echo "Chrome already installed: $(google-chrome --version)"
          fi

      - name: Run Nightly Suite
        run: |
          echo "======= Running Nightly demoqa ${{ matrix.suite }} Suite ======="
          if [ ! -f "testng-suites/demoqa-${{ matrix.suite }}.xml" ]; then
            echo "testng-suites/demoqa-${{ matrix.suite }}.xml not found - skipping"
            exit 0
          fi
          mvn -B test \
            -Dsite=demoqa \
            -DsuiteXmlFile=testng-suites/demoqa-${{ matrix.suite }}.xml \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Dallure.results.directory=target/allure-results/demoqa-${{ matrix.suite }} \
            -Dself-healing.report.path=target/self-healing/demoqa-${{ matrix.suite }}-healing-report.json \
            -Dreportportal.enable=${{ env.REPORTPORTAL_ENABLE }} \
            -Dreportportal.endpoint=${{ secrets.RP_ENDPOINT }} \
            -Dreportportal.project=${{ secrets.RP_PROJECT }} \
            -Dreportportal.attributes="site:demoqa;browser:chrome;suite:${{ matrix.suite }};ci:github-actions;run:${{ github.run_id }}" \
            -Dmaven.test.failure.ignore=true

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-demoqa-${{ matrix.suite }}
          path: target/allure-results/
          retention-days: 7

      - name: Upload Extent + Surefire Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # See the matching comment in the `test` job above — github.ref_name
          # contains a slash on pull_request events, github.run_id doesn't.
          name: test-results-demoqa-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            target/extent-reports/
            target/logs/
            target/screenshots/
            target/surefire-reports/
            target/self-healing/
          retention-days: 7

  # ================================================================
  # Security — OWASP Dependency-Check (mvn verify -Psecurity, see pom.xml)
  # ================================================================
  # Scans every resolved dependency against the NVD CVE database. First
  # run downloads/builds that database locally and is slow (several
  # minutes), so this runs nightly (same trigger as
  # accessibility-visual-test) rather than on every push — an unrelated
  # dependency bump landing mid-review shouldn't have to wait on a
  # multi-minute CVE-database rebuild just to merge. SECURITY_FAIL_CVSS
  # defaults to 11 (never fails) — report-only until the team
  # deliberately opts into gating merges on it via a repo/org Variable,
  # same reasoning as the profile's own comment in pom.xml.
  # ================================================================
  security-scan:
    needs: build
    # Still nightly-only on push/PR (by design — see the block comment
    # above: the first CVE-database build is several minutes and
    # shouldn't gate every push), but now also runnable on demand via
    # workflow_dispatch instead of only ever firing on the 02:00 cron —
    # showing as "skipped" on an ordinary push run is expected, not a
    # bug; use "Run workflow" if you need to see it run without waiting
    # for the nightly schedule.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Caches the downloaded NVD CVE database across runs — without
      # this, every nightly run would rebuild it from scratch (several
      # minutes just for the database, before any actual scanning
      # starts). Keyed loosely (no lockfile hash) since the database
      # itself, not this repo's dependency tree, is what's being cached.
      - name: Cache OWASP Dependency-Check database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-dc-db-${{ runner.os }}

      - name: Run OWASP Dependency-Check
        env:
          SECURITY_FAIL_CVSS: ${{ vars.SECURITY_FAIL_CVSS || '11' }}
        run: mvn -B verify -Psecurity -DfailBuildOnCVSS=$SECURITY_FAIL_CVSS

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          retention-days: 30

  # ================================================================
  # Secret scanning — gitleaks
  # ================================================================
  # Runs on every push/PR (unlike security-scan above, this is fast — no
  # CVE database to build) so a committed credential gets flagged before
  # it merges, not discovered later on a nightly run. exit-code left at
  # gitleaks-action's default (fails the step, not the whole workflow —
  # see continue-on-error below) for now: a repo's first-ever gitleaks
  # run commonly turns up pre-existing/false-positive matches in history
  # or test fixtures that need triage before this can safely block
  # pushes — drop continue-on-error once that initial pass is clean (or
  # a .gitleaksignore baseline is in place).
  # ================================================================
  secret-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================================================================
  # STAGE 2f - PR Comment (results summary posted on the pull request)
  # ================================================================
  # Gives a reviewer pass/fail counts and a link to the full reports
  # without leaving the PR — otherwise the only way to see results is
  # clicking into the Actions tab. `always()` so this still comments (with
  # the failure counts) when test/mobile-test failed, rather than only
  # commenting on green runs, which plain `needs:` would enforce.
  # accessibility-visual-test is deliberately NOT in `needs:` here — it
  # only ever runs on the nightly schedule (see its own `if:` above), so
  # on every actual pull_request event it would just be a permanently
  # skipped dependency this job would have to work around for no benefit.
  pr-comment:
    # checkstyle is fast and already runs in parallel with test/mobile-test,
    # so adding it here costs ~nothing in wall time but lets the comment
    # show style-gate status alongside test results instead of a reviewer
    # having to click into the Actions tab to notice Checkstyle failed.
    needs: [ test, mobile-test, checkstyle ]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Only needs surefire-reports (for pass/fail counts) — reuses the
      # same test-results-*-<run_id> artifact pattern as the allure-report
      # job, just without also pulling down extent-reports/screenshots
      # this job has no use for.
      - name: Download Surefire Results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*-${{ github.run_id }}
          path: target/
          merge-multiple: true

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # needs.<job>.result is one of success/failure/cancelled/skipped —
          # passed through as-is rather than pre-formatted, so
          # post_pr_comment.py owns the emoji/wording in one place.
          CHECKSTYLE_RESULT: ${{ needs.checkstyle.result }}
        run: python3 .github/workflows/scripts/post_pr_comment.py

  # ================================================================
  # STAGE 3 - Allure Report (merges every site's results into one report)
  # ================================================================
  allure-report:
    needs: [ test, mobile-test, accessibility-visual-test ]
    # accessibility-visual-test only actually runs on the schedule
    # trigger, and the safari leg of `test` above only runs on push (plus
    # manual dispatch with run_safari ticked — see the `test` job's own
    # `if:`) but is still skipped on PR runs — `always()` here means this
    # job still runs on ordinary pushes/PRs even though those jobs may
    # show as skipped rather than succeeded, which `needs:` alone would
    # block on. test-safari no longer exists as a separate job — its
    # matrix legs are now folded into `test` (see matrix.os there), so
    # `needs: test` already covers them.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # merge-multiple: true flattens all matching artifacts (one per
      # site, from the matrix job above) into the SAME target directory —
      # since each site's allure-results file names are UUID-based, they
      # combine into one report covering every site instead of colliding.
      - name: Download Allure Results (all sites)
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: target/allure-results/
          merge-multiple: true

      - name: Load Previous Allure History
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy Previous History for Trend Graph
        continue-on-error: true
        run: |
          if [ -d "gh-pages/allure-report/history" ]; then
            mkdir -p target/allure-results/history
            cp -r gh-pages/allure-report/history/. target/allure-results/history/
            echo "History copied for trend graph"
          else
            echo "No previous history found - first run"
          fi

      # NEITHER released tag of this action currently works — pinned to
      # a specific master commit instead. History, so nobody "fixes"
      # this back to a tag without re-reading it first:
      #
      #   @v1.13 — upstream PR #69 ("Updated docker image and workflows")
      #     moved the Docker base image to amazoncorretto:8 but only
      #     `yum install`s tar/wget/gzip, not findutils. `allure generate`
      #     shells out through `xargs` internally, so the container fails
      #     at runtime with "xargs is not available" and never writes
      #     target/allure-report (the `cp: cannot stat
      #     './target/allure-report/...'` errors are just the downstream
      #     symptom of that, not a second bug).
      #
      #   @v1.12 — predates that image change, so no xargs problem, BUT
      #     its Dockerfile is `FROM openjdk:8-jre-alpine`. Docker Hub
      #     deprecated the whole `openjdk` official-image repo in July
      #     2022, and that specific tag is no longer pullable at all —
      #     `docker build` for this action now fails outright ("Docker
      #     build failed with exit code 1") before the action ever runs.
      #     This isn't a transient registry hiccup; the tag is gone.
      #
      #   master (commit 385367c, unreleased) — already carries the fix
      #     for both: same amazoncorretto:8 base as v1.13, but
      #     `yum install`s findutils too (diff'd entrypoint.sh/action.yml
      #     against v1.13: identical — only the Dockerfile changed).
      #     Pinned to this exact commit SHA (not the `master` branch
      #     name, which is mutable and could move again without notice)
      #     since there's no tagged release with this fix yet. Re-check
      #     upstream for a new tag past v1.13 that includes this same
      #     Dockerfile before switching off the SHA pin.
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@385367cde61ac68c2568a117f7579f7f148dc459
        with:
          allure_results: target/allure-results
          allure_report: target/allure-report
          allure_history: allure-history
          keep_reports: 20

      # Builds the browser-wise/site-wise/test-type-wise/category-wise Allure
      # reports alongside the combined one generated just above — see
      # .github/workflows/scripts/generate_segmented_reports.py's own docstring for why a
      # single merged report isn't enough to tell tests apart at a glance.
      # --skip-combined since simple-elf/allure-report-action already built
      # target/allure-report from the same target/allure-results.
      # --landing-page "" since generate_landing_page.py (next job) already
      # builds a richer landing page for GitHub Pages (self-healing/flaky
      # trend included) — this script's own generic one would just be
      # redundant/conflicting here.
      - name: Generate segmented Allure reports (by browser/site/type/category)
        run: python3 .github/workflows/scripts/generate_segmented_reports.py --skip-combined --landing-page ""

      - name: Download Extent Reports (all sites)
        uses: actions/download-artifact@v4
        with:
          # Matches the github.run_id-based names used at upload time in the
          # test/mobile-test/accessibility-visual-test jobs above (see the
          # comments there — github.ref_name contained a slash on
          # pull_request events and made upload-artifact reject the name
          # outright, so nothing ever got uploaded for this pattern to find).
          pattern: test-results-*-${{ github.run_id }}
          path: target/
          merge-multiple: true

      # Aggregates every target/self-healing/<site>-healing-report.json
      # (now included in each test/mobile-test/accessibility-visual-test
      # job's artifact upload — see -Dself-healing.report.path and the
      # matching upload-artifact path list added to those jobs) into one
      # summary, so a healed-but-still-green locator has somewhere visible
      # to surface instead of sitting unread in target/.
      - name: Compute self-healing summary
        id: self_healing
        run: python3 .github/workflows/scripts/compute_self_healing_summary.py

      # Builds the per-test pass/fail trend across recent runs and flags
      # anything flip-flopping. Needs the gh-pages history checked out
      # above (same "Load Previous Allure History" step Allure's own trend
      # graph already relies on) plus this run's surefire XML, downloaded
      # by the step just above.
      - name: Compute flaky test trend
        id: flaky_trend
        run: python3 .github/workflows/scripts/compute_flaky_trend.py

      # Both reports are assembled into one local directory tree and
      # published with a SINGLE peaceiris/actions-gh-pages call below,
      # rather than two separate calls (the previous "Deploy Allure Report"
      # + "Publish Extent Report" steps). Calling that action twice in the
      # same job against the same gh-pages branch is what produced the
      # "fatal: a branch named 'gh-pages' already exists" failure: the
      # second invocation's fresh clone can race the first invocation's
      # push (GitHub's git backend isn't guaranteed to be immediately
      # consistent for a clone that starts moments after a push from the
      # same job), so it sometimes still sees no gh-pages branch, tries to
      # create one via `checkout --orphan`, and collides with local state
      # left behind from its own clone attempt. One push instead of two
      # removes the race entirely, and keep_files: true still preserves
      # whatever already lives on the branch from previous runs.
      - name: Assemble combined GitHub Pages publish directory
        run: |
          mkdir -p target/gh-pages-publish
          if [ -d "target/allure-report" ]; then
            mkdir -p target/gh-pages-publish/allure-report
            cp -r target/allure-report/. target/gh-pages-publish/allure-report/
          else
            echo "::warning::target/allure-report missing — Allure report will not be updated this run"
          fi
          if [ -d "target/extent-reports" ]; then
            mkdir -p target/gh-pages-publish/extent-report
            cp -r target/extent-reports/. target/gh-pages-publish/extent-report/
          else
            echo "::warning::target/extent-reports missing — Extent report will not be updated this run"
          fi
          if [ -d "target/allure-segmented" ]; then
            mkdir -p target/gh-pages-publish/allure-segmented
            cp -r target/allure-segmented/. target/gh-pages-publish/allure-segmented/
          else
            echo "::warning::target/allure-segmented missing — segmented (by browser/site/type/category) Allure reports will not be updated this run"
          fi
          if [ -d "target/videos" ]; then
            mkdir -p target/gh-pages-publish/videos
            cp -r target/videos/. target/gh-pages-publish/videos/
          fi

      # ExtentManager nests each report at <site>/<browser-or-mobile>/<suite>/
      # index.html (not a single flat index.html) — so extent-report/ on its
      # own has no default page a browser would land on. This generates a
      # root landing page at gh-pages-publish/index.html that links to the
      # combined + segmented Allure reports, every nested Extent report file
      # actually present this run, the self-healing summary, and the
      # flaky-test trend — one bookmarkable URL instead of guessing a path
      # or downloading the artifact zip. Moved from inline bash/printf to a
      # checked-in script once it needed to render tables from the JSON the
      # steps above produce.
      - name: Generate reports landing page
        run: python3 .github/workflows/scripts/generate_landing_page.py

      - name: Deploy Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/gh-pages-publish
          # Preserves anything already on the branch that isn't under
          # allure-report/ or extent-report/ this run (e.g. if one of the
          # two was skipped above because its source directory was
          # missing).
          keep_files: true

      # Prints clickable report links directly on the workflow run's
      # Summary tab, so viewing the reports never requires downloading
      # the artifact zip. github.event.repository.pages_html_url would be
      # nicer, but download-artifact/checkout jobs don't populate the
      # `repository` webhook payload with Pages info reliably, so the
      # standard <owner>.github.io/<repo>/ URL shape is built manually
      # instead. (If this repo IS the org/user Pages repo, i.e. named
      # exactly "<owner>.github.io", Pages serves it at the domain root
      # with no /<repo>/ segment — the if/else below handles that one case.)
      - name: Publish report links to job summary
        env:
          HEALING_COUNT: ${{ steps.self_healing.outputs.healing_count }}
          FLAKY_COUNT: ${{ steps.flaky_trend.outputs.flaky_count }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            BASE_URL="https://${OWNER}.github.io"
          else
            BASE_URL="https://${OWNER}.github.io/${REPO}"
          fi
          export BASE_URL
          {
            echo "## 📊 Test Reports"
            echo ""
            echo "| Report | Link |"
            echo "|---|---|"
            echo "| All reports (landing page) | [$BASE_URL/]($BASE_URL/) |"
            echo "| Allure — All Results (Combined) | [$BASE_URL/allure-report/]($BASE_URL/allure-report/) |"
            # Segmented Allure reports (by browser/site-app/test-type/category) —
            # read from the manifest .github/workflows/scripts/generate_segmented_reports.py wrote,
            # so this list can never drift out of sync with what was actually
            # generated (unlike hand-listing dimensions here). Delegated to a
            # script file rather than an inline heredoc — see that script's
            # own docstring for why (YAML block-scalar indentation).
            python3 .github/workflows/scripts/print_segment_links.py
            # Extent reports are nested <site>/<browser-or-mobile>/<suite>/index.html
            # (one physical file per browser/site/test-type combo) — recurse to find
            # them all instead of a flat glob, which used to silently find none.
            if [ -d "target/gh-pages-publish/extent-report" ]; then
              find target/gh-pages-publish/extent-report -name "index.html" | sort | while read -r f; do
                rel="${f#target/gh-pages-publish/extent-report/}"
                label="${rel%/index.html}"
                echo "| Extent — $label | [$BASE_URL/extent-report/$rel]($BASE_URL/extent-report/$rel) |"
              done
            fi
            echo ""
            echo "**Self-healed locators this run:** ${HEALING_COUNT:-0} &middot; **Flaky tests detected:** ${FLAKY_COUNT:-0}"
            echo ""
            echo "_Note: on first-ever deploy, GitHub Pages can take a minute or two to go live, and it must be enabled once under Settings → Pages → Source → Deploy from a branch → \`gh-pages\`._"
          } >> "$GITHUB_STEP_SUMMARY"

      # Self-healing keeps a suite green even while a locator quietly
      # drifts out from under it — fine occasionally, a problem if it's
      # happening every night and nobody's fixing the underlying locator.
      # Only checked on the nightly schedule run (not every push/PR) so a
      # one-off UI hiccup during active development doesn't fail CI; a
      # sustained drift trend failing the nightly build is the point where
      # it's worth someone's attention. Runs after the report is already
      # deployed above, so a threshold breach surfaces as a failed job
      # without blocking the reports themselves from publishing.
      - name: Check self-healing threshold (nightly only)
        if: github.event_name == 'schedule'
        env:
          HEALING_COUNT: ${{ steps.self_healing.outputs.healing_count }}
          # Adjust to taste. Repo/organization Variables (Settings →
          # Secrets and variables → Actions → Variables) can override this
          # per-repo via vars.SELF_HEALING_FAIL_THRESHOLD without editing
          # the workflow file.
          THRESHOLD: ${{ vars.SELF_HEALING_FAIL_THRESHOLD || '5' }}
        run: |
          COUNT="${HEALING_COUNT:-0}"
          echo "Self-healing events: $COUNT (threshold: $THRESHOLD)"
          if [ "$COUNT" -gt "$THRESHOLD" ]; then
            echo "::error::$COUNT locators needed self-healing tonight (threshold: $THRESHOLD). Check the self-healing summary on the landing page and fix the underlying locators."
            exit 1
          fi
