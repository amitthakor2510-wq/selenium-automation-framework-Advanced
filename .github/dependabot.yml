version: 2
updates:
  # Maven dependencies (Selenium, TestNG, Allure, WebDriverManager, Lombok, etc.)
  # This project has already been bitten twice by version drift:
  #   - Lombok < 1.18.30 crashing the compiler on JDK 21+
  #   - Chrome auto-updating past what Selenium's bundled CDP classes support
  # Weekly PRs here surface that kind of drift as a reviewable diff instead
  # of a mystery CI failure.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      allure:
        patterns:
          - "io.qameta.allure*"
      selenium:
        patterns:
          - "org.seleniumhq.selenium*"

  # GitHub Actions used in .github/workflows/github-ci.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"

  # Base images in Dockerfile (pinned by digest via Scripts/pin-docker-digests.sh) - Dependabot
  # opens a PR when a new digest/tag is published, so pinning does not freeze security updates.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

  # Selenium Grid / helper images in docker-compose*.yml. The "docker" ecosystem above only reads
  # Dockerfiles, so these tags were never updated and drifted behind the Selenium client in pom.xml
  # (Grid images 4.49.0 vs client 4.50.0). Group the hub and nodes so they move together.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    groups:
      selenium-grid:
        patterns:
          - "selenium/*"
