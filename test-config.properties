# ==================================================================
# TEST SELECTION — which tests run, and which don't
# ==================================================================
# The test-level companion to pipeline-config.properties:
#
#     pipeline-config.properties  -> which SITES may run   (fails closed)
#     test-config.properties      -> which TESTS run       (fails open — this file)
#
# Edit this file and the change applies everywhere with no other edit:
# local `mvn test`, GitHub Actions, GitLab CI, Jenkins and Docker all read
# it (it lives at the repo root, the working directory every one of them
# runs from). A switched-off test is simply not scheduled by TestNG — it is
# not reported as skipped. The console log lists each one and why.
#
# Anything not listed here, or listed =true, runs as normal. Only an
# explicit =false (or a run.only list) switches something off, so a typo can
# never silently drop a test from the suite.
#
# ── Formats ───────────────────────────────────────────────────────
#   test.<ClassName>.enabled=false          one whole test class
#   test.<Class>#<method>.enabled=false     one test method
#   test.<some.package>.*.enabled=false     every class in that package and below
#   group.<name>.enabled=false              every test carrying that TestNG group
#                                           (groups in use: smoke, regression, api,
#                                            keyword-driven, data-driven, perf, ...)
#   run.only=ClassA,ClassB                  run ONLY these classes; blank = no limit
#
# <ClassName> is the simple name (LoginTest) or the fully-qualified name.
# Anything switched off stays off — run.only can narrow the set further but
# never re-enables a test that is disabled.
#
# ── One-off overrides without editing this file ─────────────────
#   mvn test -Dtests.run.only=LoginTest
#   mvn test -Dtests.disabled=BrokenLinksImagesTest,LoginTest#verifyValidLogin
#   mvn test -Dtest.config.file=my-other-config.properties
#
# ── Notes ────────────────────────────────────────────────────────
#  - This chooses among tests the chosen suite XML already includes. It can
#    switch tests OFF, it cannot add a test a suite does not list.
#  - Whole sites are switched on/off in pipeline-config.properties instead.
#  - A method inherited from a base class is matched by the class that
#    declares it — disable it by that class, or by group.
# ==================================================================

run.only=

